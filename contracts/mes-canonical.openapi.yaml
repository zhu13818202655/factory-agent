      tags: [plan]
      operationId: SclzdBarcodeQuery
      summary: 制单条码扫描信息（整版/非整版双集合）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - type: object
                  required: [dh, detailId]
                  properties:
                    dh: { type: string, description: 单号 }
                    detailId: { type: integer, description: 物料编号 }
      responses:
        '200':
          description: 条码扫描集合
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/BarcodeBundle'

  # ---------------------------------------------------------------- 产量与进度
  /api/NetYf/Sclzd/BarcodeClQuery:
    post:
      tags: [output]
      operationId: BarcodeClQuery
      summary: 线下工序产量产能（扫码产量，工资 Type=0 数据源）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
      responses:
        '200':
          description: 扫码产量明细
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_BarcodeCl'
  /api/NetYf/Sclzd/HuohaoWtCLQuery:
    post:
      tags: [output]
      operationId: HuohaoWtCLQuery
      summary: 工序产量查询（footer.sl_total）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
                - type: object
                  required: [queryFooter, scheme]
                  properties:
                    queryFooter: { type: boolean }
                    scheme:
                      type: string
                      enum: ["货号工序", "工序"]
      responses:
        '200':
          description: 工序产量列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_HuohaoWtCL'
  /api/NetYf/PinFeng/GridPageList:
    post:
      tags: [output]
      operationId: PinFengGridPageList
      summary: 手工账分页列表（工资 Type=2 数据源；唯一含次品 cp 字段，C.5）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
      responses:
        '200':
          description: 手工账列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_PinFeng'
  /api/NetYf/Sclzd/WorktypeProgressQuery:
    post:
      tags: [output]
      operationId: WorktypeProgressQuery
      summary: 工序进度（uid 非空 = 已扫码 = 完成，M6/M18）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PageParams'
                - type: object
                  required: [userid, uid]
                  properties:
                    userid: { type: string, description: 物料编号 }
                    uid:
                      type: string
                      description: 员工工号（可为空串）
      responses:
        '200':
          description: 工序进度列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_WorktypeProgress'
  /api/NetYf/Sclzd/YskQuery:
    post:
      tags: [output]
      operationId: YskQuery
      summary: 已扫描查询（无 queryFooter 入参但返回 footer：bs_total/sl_total/je_total）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
                - type: object
                  required: [Uid]
                  properties:
                    Uid: { type: string, description: 员工工号 }
      responses:
        '200':
          description: 已扫描明细
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_Ysk'
  /api/NetYf/Sclzd/WskQuery:
    post:
      tags: [output]
      operationId: WskQuery
      summary: 未扫描查询（footer：bs_total/sl_total）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
      responses:
        '200':
          description: 未扫描明细
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_Wsk'

  # ---------------------------------------------------------------- 工资与排名
  /api/NetYf/Sclzd/GongziMxQuery:
    post:
      tags: [payroll]
      operationId: GongziMxQuery
      summary: 工资明细/汇总（三源合一 Type=0 扫码/1 吊挂/2 手工账；je=sl×price，M9/M18）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
                - type: object
                  required: [queryFooter, Uid, Flag, Type, scheme]
                  properties:
                    queryFooter: { type: boolean }
                    Uid: { type: string, description: 员工工号 }
                    Flag:
                      type: string
                      enum: ["0", "1"]
                      description: 0 按扫描日期 / 1 按审核日期（默认口径未定，C.12）
                    Type:
                      type: string
                      description: 工资类型逗号分隔，如 "0,1,2"
                    scheme:
                      type: string
                      description: 空=明细查询；有值（汇总/hz/HZ）=汇总查询
      responses:
        '200':
          description: 工资明细或汇总
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_GongziMx'
  /api/NetYf/Sclzd/GongziJeOrderQuery:
    post:
      tags: [payroll]
      operationId: GongziJeOrderQuery
      summary: 员工工资排名（按 je 倒序返回，位次按返回顺序编号，M7）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
                - type: object
                  required: [queryFooter]
                  properties:
                    queryFooter: { type: boolean }
      responses:
        '200':
          description: 工资排名列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_GongziJeOrder'

  # ---------------------------------------------------------------------- 吊挂
  /api/NetYf/Dg/GridPageList:
    post:
      tags: [dg]
      operationId: DgGridPageList
      summary: 吊挂中间库分页列表（dg_Pwd 为敏感字段）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PageParams'
      responses:
        '200':
          description: 吊挂配置列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_Dg'
  /api/NetYf/Dg/DgZuGridPageList:
    post:
      tags: [dg]
      operationId: DgZuGridPageList
      summary: 吊挂组别分页列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PageParams'
      responses:
        '200':
          description: 吊挂组别列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_DgZu'
  /api/NetYf/Dg/DgClQuery:
    post:
      tags: [dg]
      operationId: DgClQuery
      summary: 吊挂工序产能（工资 Type=1 数据源）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
      responses:
        '200':
          description: 吊挂产能明细
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_DgCl'

components:
  schemas:
    # ------------------------------------------------------------ 公共信封与参数
    MesEnvelope:
      type: object
      description: 统一响应信封（M13/M14）。code 仅 0/1；失败原因由 message 区分。
      required: [code, message, result, timestamp]
      properties:
        code:
          type: integer
          enum: [0, 1]
        message:
          type: string
          description: >
            成功时为「成功」等文本；失败时为可区分原因：
            app_key不能为空 / 无效app_key / 加密信息解析失败,请检查参数是否正确 /
            请求已过期 / 签名无效 / 无登录权限（token 专属）。
        result:
          description: 业务数据；失败时为 null。列表类为 {list,total}，部分带 footer。
        timestamp:
          type: integer
          description: 秒级时间戳回显
    CommonParams:
      type: object
      description: 业务请求公共参数（M1/M8）。凭据值只能来自 MesCredentialBundle。
      required: [app_key, timestamp, sign]
      properties:
        app_key:
          type: string
          description: 明文 appkey（即租户 ID，M4）
        timestamp:
          type: integer
          description: 签名生成时间戳
        sign:
          type: string
          description: 数字签名，MD5 后转小写（32 位小写十六进制）
    PageParams:
      type: object
      required: [page, size]
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }
    PagedDateRange:
      type: object
      required: [page, size, dates, datee]
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }
