          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - type: object
                  required: [dh]
                  properties:
                    dh: { type: string, description: 单号 }
      responses:
        '200':
          description: 制单工序列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_SclzdWorktype'
  /api/NetYf/Sclzd/SclzdBarcodeQuery:
