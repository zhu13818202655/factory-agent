# 弘兆 MES 客户真实形态契约（Story 5 重写）
#
# 本契约描述客户已确认的 27 个 MES 接口（来源：contracts/customer/2026-08-25/
# 与 docs/reference/弘兆MES接口整体说明-V2.md 的 M1~M20/K1~K7）。
#
# 关键约定（M13/M14/M15）：
# - 全部 POST + application/json；Header `Authorization: Bearer {accessToken}`；
#   Body 公共参数 app_key/timestamp/sign + 业务参数。
# - 统一响应信封 MesEnvelope{code, message, result, timestamp}；code 仅 0/1，
#   失败原因只通过 message 文本区分；权限不足表现为过滤后无数据，无专用错误码。
# - 列表 result.{list,total}；带合计的接口追加 result.footer。
# - operationId 采用客户接口名（如 GongziMxQuery），禁止 A1_/C1_ 类合成前缀。
openapi: 3.1.0
info:
  title: Hongzhao MES Customer Contract
  version: customer-v2
  description: |
    客户真实接口形态的兼容边界。`data_api/` 是唯一允许依赖本契约细节的包；
    应用与领域代码只依赖 `MesDataSource` Protocol。

    成功判断两层规则（M14）：
    1. HTTP status：200 正常到达；404 接口地址/路径错误。
    2. 响应体 code：1 成功取 result；0 失败按 message 区分
       （app_key不能为空 / 无效app_key / 加密信息解析失败 / 请求已过期 / 签名无效）。
servers:
  - url: http://hzlinkbiz.ywhzsoft.com:9002
    description: 客户测试环境根地址（测试 app_key 未交付，第五章 B.2）
tags:
  - name: auth
    description: 认证与凭证（3）
  - name: baseinfo
    description: 基础数据（9）
  - name: plan
    description: 生产计划与制单（4）
  - name: output
    description: 产量与进度（6）
  - name: payroll
    description: 工资与排名（2）
  - name: dg
    description: 吊挂（3）
paths:
  # ---------------------------------------------------------------- 认证与凭证
  /api/system/token:
    post:
      tags: [auth]
      operationId: SystemToken
      summary: 获取访问令牌（凭证入口，前端调用；无需 Bearer/sign）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_key]
              properties:
                app_key:
                  type: string
                  description: 用户访问智能体时携带的加密 app_key
      responses:
        '200':
          description: 凭证包
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/CredentialBundle'
        '404':
          description: 无登录权限（body 内 code=0）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesEnvelope'
  /api/print/query-sign:
    post:
      tags: [auth]
      operationId: QuerySign
      summary: 获取签名（sign 备用手段）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_key, timestamp]
              properties:
                app_key: { type: string }
                timestamp: { type: integer }
      responses:
        '200':
          description: 签名
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - type: object
                    properties:
                      result: { type: string }
  /api/print/test-permissions:
    post:
      tags: [auth]
      operationId: TestPermissions
      summary: 测试权限（联调自测鉴权链路）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonParams'
      responses:
        '200':
          description: 固定文本「调用成功」
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - type: object
                    properties:
                      result: { type: string }

  # ------------------------------------------------------------------ 基础数据
  /api/NetYf/Baseinfo/UserInfoQuery:
    post:
      tags: [baseinfo]
      operationId: UserInfoQuery
      summary: 登录用户信息查询
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - type: object
                  required: [USERNAME]
                  properties:
                    USERNAME: { type: string }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_UserInfo'
  /api/NetYf/Baseinfo/MoveMenuQuery:
    post:
      tags: [baseinfo]
      operationId: MoveMenuQuery
      summary: 移动端菜单查询（当前版本不使用，K7）
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonParams'
      responses:
        '200':
          description: 菜单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_MoveMenu'
  /api/NetYf/Baseinfo/HuohaoQuery:
    post:
      tags: [baseinfo]
      operationId: HuohaoQuery
      summary: 货号信息查询（非 list 结构）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonParams'
      responses:
        '200':
          description: 货号与货号类型集合
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/HuohaoBundle'
  /api/NetYf/Baseinfo/HuohaoFormQuery:
    post:
      tags: [baseinfo]
      operationId: HuohaoFormQuery
      summary: 货号档案查询（颜色/尺码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - type: object
                  required: [huohao]
                  properties:
                    huohao: { type: string }
      responses:
        '200':
          description: 货号档案集合
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/HuohaoFormBundle'
  /api/NetYf/Baseinfo/ScTypeQuery:
    post:
      tags: [baseinfo]
      operationId: ScTypeQuery
      summary: 生产类型查询
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonParams'
      responses:
        '200':
          description: 生产类型列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_ScType'
  /api/NetYf/Baseinfo/RfidWorktypeQuery:
    post:
      tags: [baseinfo]
      operationId: RfidWorktypeQuery
      summary: 工序字典查询
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonParams'
      responses:
        '200':
          description: 工序列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_RfidWorktype'
  /api/NetYf/Baseinfo/HuohaoWorktypeQuery:
    post:
      tags: [baseinfo]
      operationId: HuohaoWorktypeQuery
      summary: 货号工序查询（进度计算的总工序数依据，M18）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - type: object
                  required: [huohao]
                  properties:
                    huohao: { type: string }
      responses:
        '200':
          description: 货号工序列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_HuohaoWorktype'
  /api/NetYf/Baseinfo/EmployeeQuery:
    post:
      tags: [baseinfo]
      operationId: EmployeeQuery
      summary: 员工查询（DataScope 当前归属来源之一）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - type: object
                  properties:
                    uid:
                      type: string
                      description: 员工工号（可选）
      responses:
        '200':
          description: 员工列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_Employee'
  /api/NetYf/Baseinfo/DeptQuery:
    post:
      tags: [baseinfo]
      operationId: DeptQuery
      summary: 部门（车间）查询（组织树组装依据，K2 只取最新关系）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonParams'
      responses:
        '200':
          description: 部门列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_Dept'

  # -------------------------------------------------------------- 生产计划与制单
  /api/NetYf/Plan/GridPageList:
    post:
      tags: [plan]
      operationId: PlanGridPageList
      summary: 生产计划分页列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
      responses:
        '200':
          description: 计划列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_Plan'
  /api/NetYf/Sclzd/GridPageList:
    post:
      tags: [plan]
      operationId: SclzdGridPageList
      summary: 生产制单分页列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommonParams'
                - $ref: '#/components/schemas/PagedDateRange'
      responses:
        '200':
          description: 制单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MesEnvelope'
                  - $ref: '#/components/schemas/ListResult_Sclzd'
  /api/NetYf/Sclzd/SclzdWorktypeQuery:
    post:
      tags: [plan]
      operationId: SclzdWorktypeQuery
      summary: 制单工序查询
      requestBody:
        required: true
