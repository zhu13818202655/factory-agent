# 现行 V2 事实与 V1 安全字典的受审语义。
# 来源：docs/product/需求及方案整理.md、现行两份 V2 接口契约及 ADR-0010。
# confirmed_metrics 可用于受审计算；unconfirmed_metrics 必须返回 unavailable。
# 本文件是可信元数据，不是租户当前配置、授权证明或原始响应样例。
version: 4

common_fields:
  uid: 员工工号；身份字段仅在可信执行层使用
  uname: 员工姓名；身份字段不进入模型观察
  dept: 部门编号；来自授权范围的收窄条件
  deptname: 部门名称；不作为身份范围的授权依据
  huohao: 内部货号编码；V1 表单与货号工序以该编码关联
  bbreed: 业务款号；与内部货号分别保留，不按名称猜关系
  description: 品名
  sctype: 生产类型稳定编码
  sctypename: 生产类型名称
  worktype: 工序稳定编码；现行 V2 事实中的工序维度
  wtname: 工序名称
  color: 原始颜色标识
  chima: 原始尺码标识；不自动合并 XXL 与 2XL
  chuanghao: 床号；字符串精确匹配，保留前导零
  baohao: 包号
  dw: 单位
  rq: 制单业务日历日期；进度窗口时间锚，不从制单编号推断
  inputdate: 报工日期；工资产量 Flag=0 的窗口时间锚
  inputtime: 报工时间
  check_time: 审核时间；工资产量 Flag=1 的窗口时间锚
  ischeck: 审核状态
  je: 工资产量金额贡献；个人工资明细属于敏感数据
  dh: 制单编号；用于实体定位，不等同于计划号
  jhdh: 计划号；订单展示维度，空值归入一个未关联计划号组
  sl: 工资产量报工数量贡献；跨工序合计单位为件·工序
  bs: 客户包数贡献；按受审口径累加，不按行数重建
  fhsl: 生产进度发卡数量贡献
  sssl: 生产进度截至取数时的累计实收数量贡献
  zpsl: 生产进度正品数量贡献
  wgs: 客户已完工工序统计贡献；不能代替完整配置工序集合
  wts: 客户总工序统计贡献；不能直接作为全床配置工序种类数
  wcl: 实收合计除以发卡合计的百分比；两位小数
  wsort: 工序排序
  userid: 进度物料编号；只从获准实体视图解析
  id: 客户行或配置记录稳定编号；语境决定实体类型
  section: 工段名称；工序目录中的名称关系不是生产类型稳定编码
  gxtype: 工序流转类型
  vehicle_type: 车种；与工序名称分别保留，空值表示未提供
  zhgx: 是否最后工序
  using_state: 款号工序使用状态；0 停用，1 使用中

roles:
  enumeration:
    "00": 员工
    "01": 组长
    "02": 管理
    "99": 老板
  source: 可信认证返回的角色与绑定部门
  data_range:
    "00": 本人
    "01": 所属绑定组
    "02": 绑定部门或车间
    "99": 全厂
  note: 字典配置读取适用于四角色，但仅限当前租户的安全投影；生产事实仍逐动作复用 FR 授权和 DataScope。

field_contexts:
  huohao:
    GongziClQuery: 内部货号编码
    ScjdQuery: 内部货号编码
    HuohaoFormQuery: 内部货号编码
    HuohaoWorktypeQuery: 内部货号编码
    SclzdWorktypeQuery: 内部货号编码
  worktype:
    GongziClQuery: 工序编码
    ScjdQuery: 工序编码
  rq:
    ScjdQuery: 制单业务日历日期；查询窗口选择该日期的制单，进度数值仍为累计值
  inputdate:
    GongziClQuery: Flag=0 报工日期
  check_time:
    GongziClQuery: Flag=1 审核时间

quantity_contexts:
  GongziClQuery:
    sl: 报工数量贡献；件·工序口径
    je: 金额贡献
    bs: 客户包数贡献
  ScjdQuery:
    bs: 包数贡献
    fhsl: 发卡数量贡献
    sssl: 累计实收数量贡献
    zpsl: 正品数量贡献
    wgs: 已完工工序统计贡献
    wts: 总工序统计贡献
    wcl: 合计实收除以合计发卡乘以 100，零分母返回 0

confirmed_metrics:
  payroll.amount:
    formula: 数量乘以单价；只在授权可信计算层处理
    source: 需求及方案整理的工资口径
  payroll.gross_total:
    formula: sum(GongziClQuery.je)；适用 footer.je_total 作独立对账
    source: 工资产量 V2 契约与 ADR-0010
  payroll.piece_count:
    formula: sum(GongziClQuery.sl)
    source: 需求及方案整理的计件件数口径
  output.personal:
    formula: 本人获准窗口内 sum(GongziClQuery.sl)
    source: 需求及方案整理的个人产量口径
  output.reported_qty:
    formula: sum(GongziClQuery.sl)
    source: 工资产量 V2；件·工序口径，不代表独立成衣完工件数
  output.reported_amount:
    formula: sum(GongziClQuery.je)
    source: 工资产量 V2
  output.worktype_share:
    formula: 工序报工量除以同一获准计划号的 sum(ScjdQuery.fhsl)
    source: 现行受审订单产量配方
  progress.package_ratio:
    formula: sum(ScjdQuery.sssl) / sum(ScjdQuery.fhsl) * 100；零分母为 0，ROUND_HALF_UP 两位小数
    source: 生产进度 V2 与 ADR-0010
  progress.package_count:
    formula: sum(ScjdQuery.bs)
    source: 生产进度 V2 客户贡献
  progress.order_count:
    formula: 按计划号分组计数；空计划号统一一个统计组
    source: 需求及方案整理的计划号口径
  progress.sheet_count:
    formula: COUNT(DISTINCT 非空 dh)
    source: 现行受审进度配方
  progress.worktype_count:
    formula: sum(ScjdQuery.wts)
    source: ADR-0010 的客户贡献口径；不表示完整配置工序种类数
  progress.done_worktype_count:
    formula: sum(ScjdQuery.wgs)
    source: ADR-0010 的客户贡献口径
  progress.worktype_order:
    formula: ScjdQuery.wsort
    source: 生产进度 V2 的工序排序字段
  progress.issued_qty:
    formula: sum(ScjdQuery.fhsl)
    source: 生产进度 V2 与 ADR-0010
  progress.received_qty:
    formula: sum(ScjdQuery.sssl)
    source: 生产进度 V2；是所选制单截至取数时累计实收，不是窗口新增报工
  progress.good_qty:
    formula: sum(ScjdQuery.zpsl)
    source: 生产进度 V2 与 ADR-0010
  output.participant_count:
    formula: COUNT(DISTINCT 非空 uid)
    source: 完整获准工资产量窗口中的参与人数
  workshop.effective_headcount:
    formula: 各获准部门 COUNT(DISTINCT 非空 uid)
    source: 受审报工人数口径
  workshop.output_per_capita:
    formula: 部门报工合计除以去重参与人数；无有效分母则 unavailable
    source: 需求及方案整理的管理功能表
  workshop.rank:
    formula: 可见部门不少于两个时按产量降序排名；并列保持受审规则，部门编码确定行序
    source: 现行受审车间对比配方
  payroll.rank_position:
    formula: 授权人群内按员工汇总一次后按金额降序、员工编码升序确定本地位次
    source: 现行受审收入排名配方；员工角色无该能力
  payroll.group_rank:
    formula: 确认本人当前小组，完整获准组员汇总排序后再定位本人
    source: 需求及方案整理与 ADR-0010
  payroll.group_size:
    formula: 完整获准小组内按员工编号汇总后的人数
    source: ADR-0010
  payroll.package_count:
    formula: sum(GongziClQuery.bs)
    source: 工资产量 V2 客户包数贡献
  payroll.gross_by_dept:
    formula: 获准部门内 sum(GongziClQuery.je)
    source: 需求及方案整理的应发合计口径
  org.headcount:
    formula: 受审安全在册名册按员工编号计数
    source: 需求及方案整理与 ADR-0010
    note: 名册用于受审人数分母，身份不进入模型观察；不猜在职状态。
  payroll.avg_by_dept:
    formula: 应发合计除以安全在册人数；缺分母则 unavailable
    source: 需求及方案整理的人均工资口径
  time.flag_default:
    formula: GongziClQuery Flag=0 按报工日期；Flag=1 按审核日期且已审核
    source: 工资产量 V2 契约
  config.process_types:
    formula: 完整配置集合中 COUNT(DISTINCT 非空工序编码)
    source: 款号或获准制单配置；与配置记录数及事实已报工种类数分别展示
  config.size_types:
    formula: 完整尺码配置集合中 COUNT(DISTINCT 非空原始尺码标识)
    source: 货号表单配置；保留版型，不合并不同名称

confirmed_rules:
  facts.current_sources:
    rule: 工资和产量仅用工资产量 V2，进度仅用生产进度 V2；不复活被替代的 V1 事实链
    source: 需求及方案整理与 ADR-0010
  dictionaries.safe_projection:
    rule: 当前租户四角色均可读取批准的基础字典配置安全投影；工价、身份、凭据和备注不进入字典观察或缓存
    source: 需求方确认的字典配置权限与现行安全基线
  dictionaries.entity_scope:
    rule: 货号表单和制单工序是完整实体子集；制单由获准进度视图解析，实体子集不冒充租户全集
    source: 缓存优先的 SageQL 包集成与 L2 自主分析方案
  dictionaries.completeness:
    rule: 每个命名集合分别按真实 total 验证完整；同一表单颜色与尺码均完整才缓存
    source: 现行客户基础字典契约
  dictionaries.relationships:
    rule: 内部货号、工序、生产类型按稳定编码关联；工段名称关系需唯一性证据，缺失或冲突不可用
    source: 现行客户基础字典契约
  dictionaries.hanging_lines:
    rule: 吊挂线别和组别仅作当前租户安全字典；分页完整后缓存，不建立未经确认的线组到部门关系
    source: 客户吊挂组别契约及基础字典权限
  time_range.max:
    rule: 事实回溯边界为 365 天；无时间维度的配置问题不强制补事实窗口
    source: ADR-0010 与 L2 方案
  cache.retention:
    rule: 历史事实快照 24 小时，含今天完整窗口 90 秒，安全基础字典 24 小时；不拼接跨窗快照
    source: ADR-0010 及基础目录保留策略

unconfirmed_metrics:
  plan.target_output:
    gap: 计划接口已弃用，目标产量与达成率无已确认数据源
    source: 需求及方案整理
  delivery.warning:
    gap: 无已确认交期数据源
    source: 需求及方案整理
  progress.cut_qty:
    gap: 不提供旧裁剪数量派生；当前发卡分母为 fhsl
    source: 现行生产进度 V2 契约
  progress.finished_packages:
    gap: 未确认纯制单 bgs/bts 的完整明细派生规则；不能从 wcl 推导完工包数
    source: ADR-0010
  progress.unit_total:
    gap: 当前 V2 没有旧 wcs 字符串字段；不恢复 V1 来源或推导代值
    source: 现行生产进度 V2 契约
  progress.unit_done:
    gap: 当前 V2 没有旧 wcs 字符串字段；不恢复 V1 来源或推导代值
    source: 现行生产进度 V2 契约
  output.finished_garments:
    gap: 多工序报工贡献不代表独立成衣完工件数，无已确认去重或计算规则
    source: ADR-0010
  order.in_progress_qty:
    gap: 未确认独立在制数量口径，不恢复未扫描 V1 事实链
    source: 需求及方案整理
