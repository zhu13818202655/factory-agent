# API Catalog: reviewed registry of approved MES operations.
# File changes are permission/semantics changes and require human review.
#
# 口径来源：``docs/product/AI问答对外接口-整理.md``（客户接口契约）与
# ``docs/product/需求及方案整理.md``（功能与确认结论）。
#
# - operation_id 采用客户接口名（契约形态）。
# - parameter_sources: credential（只能来自 MesCredentialBundle）/ scope（只能来自
#   DataScope）/ filter / clock。凭据参数绝不可来自 filter 或模型输出。
# - pagination: none 或 list_total（result.list/result.total，累计到 total 结束）。
# - MoveMenuQuery 登记为 enabled: false：加载器允许存在但运行时拒绝调用。
# - usage_category: MES 调用统计的计费分类（口径见 docs/api/统计与运营接口.md）：
#   output（产量）/ payroll（工资）/ order（订单）/ other（其他：认证2+基础数据9+吊挂3）。
#   能力分类 ≠ API 分类，不得以 dimensions=capability 顶替。
version: 2
operations:
  # ------------------------------------------------------------ 认证与凭证 (2)
  - operation_id: SystemToken
    path: /api/system/token
    kind: identity
    enabled: true
    parameter_sources:
      app_key: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [access_token, sign, app_key]
    related_keys: []

  - operation_id: TestPermissions
    path: /api/print/test-permissions
    kind: identity
    enabled: true
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [sign, app_key]
    related_keys: []

  # ------------------------------------------------------------ 基础数据 (9)
  - operation_id: UserInfoQuery
    path: /api/NetYf/Baseinfo/UserInfoQuery
    kind: resource
    resource: user_info
    required_params: [USERNAME]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      USERNAME: filter
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [username]

  - operation_id: MoveMenuQuery
    path: /api/NetYf/Baseinfo/MoveMenuQuery
    kind: resource
    resource: move_menu
    enabled: false   # 当前版本不使用；运行时拒绝调用
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [uid]

  - operation_id: HuohaoQuery
    path: /api/NetYf/Baseinfo/HuohaoQuery
    kind: resource
    resource: huohao
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao]

  - operation_id: HuohaoFormQuery
    path: /api/NetYf/Baseinfo/HuohaoFormQuery
    kind: resource
    resource: huohao_form
    required_params: [huohao]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      huohao: filter
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao]

  - operation_id: ScTypeQuery
    path: /api/NetYf/Baseinfo/ScTypeQuery
    kind: resource
    resource: sc_type
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: []

  - operation_id: RfidWorktypeQuery
    path: /api/NetYf/Baseinfo/RfidWorktypeQuery
    kind: resource
    resource: rfid_worktype
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [worktype]

  - operation_id: HuohaoWorktypeQuery
    path: /api/NetYf/Baseinfo/HuohaoWorktypeQuery
    kind: resource
    resource: huohao_worktype
    required_params: [huohao]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      huohao: filter
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao, worktype]

  - operation_id: EmployeeQuery
    path: /api/NetYf/Baseinfo/EmployeeQuery
    kind: resource
    resource: employee
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      uid: scope
    pagination: none
    list_key: employeeList
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [movepassword, mobile, uname]
    related_keys: [uid, dept]

  - operation_id: DeptQuery
    path: /api/NetYf/Baseinfo/DeptQuery
    kind: resource
    resource: dept
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    list_key: deptList
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dept]

  # ------------------------------------------------------ 生产计划与制单 (4)
  # 已弃用（2026-09-15 口径重梳，见 docs/design/进度与产量功能重梳方案.md）：
  # 订单数量改取「缝制生产进度」ScjdQuery.zsl，进度改取 ScjdQuery.wcl。
  # 保留登记条目并置 enabled: false（加载器允许存在、运行时拒绝调用）：条目仍在
  # mes_operation_category 种子与统计面的分类映射里，删条目会牵动两处计数。
  # Plan 的 khname / khid / dddh / finish_date 实测全空，客户/交期族列已整族删除。
  - operation_id: PlanGridPageList
    path: /api/NetYf/Plan/GridPageList
    kind: resource
    resource: plan
    enabled: false
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, jhdh, huohao]

  - operation_id: SclzdGridPageList
    path: /api/NetYf/Sclzd/GridPageList
    kind: resource
    resource: sclzd
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, dddh, huohao, id]

  - operation_id: SclzdWorktypeQuery
    path: /api/NetYf/Sclzd/SclzdWorktypeQuery
    kind: resource
    resource: sclzd_worktype
    required_params: [dh]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      dh: filter
    pagination: none
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, wt]

  - operation_id: SclzdBarcodeQuery
    path: /api/NetYf/Sclzd/SclzdBarcodeQuery
    kind: resource
    resource: sclzd_barcode
    required_params: [dh, detailId]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      dh: filter
      detailId: filter
    pagination: none
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, id, uid]

  # ------------------------------------------------------------ 缝制进度 (4)
  # 进度能力的唯一取数族（口径见 docs/design/进度与产量功能重梳方案.md §1.1/§3）。
  # 登记范围 = 该节的「3 必需 + 1 可选」；「缝制详细进度」ScjdFzMxQuery 与
  # 「缝制工序总体进度」ScjdFzHzWorktypeQuery 暂不登记：本厂无实测响应样本，且客户
  # 示例自相矛盾（sksl+wsksl 恒为 220 而 sssl 为 214/214/220），抽样确认后再登记。
  # 进度族统一 usage_category: order（进度 = 订单维度；产量族才是 output）。
  - operation_id: ScjdQuery
    path: /api/NetYf/Sclzd/ScjdQuery
    kind: resource
    resource: scjd
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    # 实测响应是 result.main[]（流程卡行）+ result.detail（当页汇总）+ result.total，
    # 不是通用 result.list 外壳；list_key 因此指 main。
    list_key: main
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, huohao]

  - operation_id: ScjdDetailQuery
    path: /api/NetYf/Sclzd/ScjdDetailQuery
    kind: resource
    resource: scjd_detail
    # dh 来自 NarrowedFilters.order_codes（单订单场景），由适配层下推；与
    # HuohaoWtCLQuery.huohao 的服务端下推同法，业务值绝不来自模型文本。
    required_params: [dates, datee, dh]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
      dh: filter
    pagination: list_total
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, id]

  - operation_id: ScjdGxQuery
    path: /api/NetYf/Sclzd/ScjdGxQuery
    kind: resource
    resource: scjd_gx
    # 客户契约无 page/size（一次返回该包全部已刷卡工序），也无 dates/datee；
    # 这两个参数未登记即被 _build_body 丢弃，不会误发。userid = 物料编号，
    # 来自 NarrowedFilters.material_ids（包级下钻到工序级）。
    required_params: [userid]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      userid: filter
      uid: scope
    pagination: none
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [userid, uid, worktype]

  - operation_id: ScjdFzHzQuery
    path: /api/NetYf/Sclzd/ScjdFzHzQuery
    kind: resource
    resource: scjd_fz_hz
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao, chuanghao]

  # -------------------------------------------------------- 产量与进度 (6)
  - operation_id: BarcodeClQuery
    path: /api/NetYf/Sclzd/BarcodeClQuery
    kind: resource
    resource: barcode_cl
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl, sssl]
    related_keys: [uid, dept, id, huohao, worktype]

  - operation_id: HuohaoWtCLQuery
    path: /api/NetYf/Sclzd/HuohaoWtCLQuery
    kind: resource
    resource: huohao_wt_cl
    required_params: [queryFooter, scheme, dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      queryFooter: filter
      scheme: filter
      dates: filter
      datee: filter
      # 2026-09-13 实测支持的服务端过滤（接口文档 §7.2）：huohao 取值是款号
      # bbreed；worktype 取值是工序名。单款号时由适配层下推 huohao。
      huohao: filter
      worktype: filter
    pagination: list_total
    supports_footer: true
    boolean_params: [queryFooter]
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: [sssl]
    related_keys: [huohao, worktype]

  - operation_id: PinFengGridPageList
    path: /api/NetYf/PinFeng/GridPageList
    kind: resource
    resource: pin_feng
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl, cp]
    related_keys: [uid, dept, dh, worktype]

  - operation_id: WorktypeProgressQuery
    path: /api/NetYf/Sclzd/WorktypeProgressQuery
    kind: resource
    resource: worktype_progress
    # customer doc says uid is optional (可为空); userid (material id)
    # is required. uid stays scope-sourced and is injected only when the scope
    # resolves to a single employee.
    required_params: [userid]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      userid: filter
      uid: scope
    pagination: list_total
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [userid, uid, worktype]

  - operation_id: YskQuery
    path: /api/NetYf/Sclzd/YskQuery
    kind: resource
    resource: ysk
    # Uid is scope-sourced and optional (factory-wide Ysk aggregations
    # call without a single employee; MES row-level filtering decides the range).
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      Uid: scope
      dates: filter
      datee: filter
    pagination: list_total
    supports_footer: true   # 无 queryFooter 入参但返回 footer
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl]
    related_keys: [uid, dept, id, huohao, worktype]

  - operation_id: WskQuery
    path: /api/NetYf/Sclzd/WskQuery
    kind: resource
    resource: wsk
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    supports_footer: true   # 无 queryFooter 入参但返回 footer
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [id, huohao, worktype]

  # ---------------------------------------------------------- 工资与排名 (2)
  - operation_id: GongziMxQuery
    path: /api/NetYf/Sclzd/GongziMxQuery
    kind: resource
    resource: gongzi_mx
    # Uid is scope-sourced and optional (客户确认 2026-09-06): 传员工工号按该员工
    # 查询；不传则由 MES 按当前角色过滤返回。产品端仅在单员工场景（个人本人/点名
    # 查某员工）注入 Uid，来源只能是 NarrowedFilters.employee_ids。
    required_params: [queryFooter, Flag, Type, scheme, dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      queryFooter: filter
      Uid: scope
      Flag: filter        # 日期口径：0 按扫描日期 / 1 按审核日期；默认 "0"（客户公共参数约定）
      Type: filter
      scheme: filter
      dates: filter
      datee: filter
    pagination: list_total
    boolean_params: [queryFooter]
    supports_footer: true
    usage_category: payroll
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl, fhsl]
    related_keys: [uid, dept, id, huohao, worktype]

  - operation_id: GongziJeOrderQuery
    path: /api/NetYf/Sclzd/GongziJeOrderQuery
    kind: resource
    resource: gongzi_je_order
    required_params: [queryFooter, dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      queryFooter: filter
      dates: filter
      datee: filter
    pagination: list_total
    supports_footer: true
    usage_category: payroll
    boolean_params: [queryFooter]
    timeout_seconds: 10.0
    sensitive_fields: [je, bs, uname]
    related_keys: [uid, dept]

  # ------------------------------------------------------------------ 吊挂 (3)
  - operation_id: DgGridPageList
    path: /api/NetYf/Dg/GridPageList
    kind: resource
    resource: dg
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
    pagination: list_total
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [dg_Pwd, dg_Uid]
    related_keys: []

  - operation_id: DgZuGridPageList
    path: /api/NetYf/Dg/DgZuGridPageList
    kind: resource
    resource: dg_zu
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
    pagination: list_total
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: []

  - operation_id: DgClQuery
    path: /api/NetYf/Dg/DgClQuery
    kind: resource
    resource: dg_cl
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl]
    related_keys: [uid, dept, id, huohao, worktype]
