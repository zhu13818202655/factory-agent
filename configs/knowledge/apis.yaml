  # ---------------------------------------------------------- 工资与排名 (2)
  - operation_id: GongziMxQuery
    path: /api/NetYf/Sclzd/GongziMxQuery
    kind: resource
    resource: gongzi_mx
    # Story 7: Uid is scope-sourced and optional so FR-011 (全厂工资统计) can
    # call scheme=hz factory-wide without a single employee; MES row-level
    # filtering (M3/M19) decides the visible range. Personal/target queries
    # inject Uid from NarrowedFilters.employee_ids.
    required_params: [queryFooter, Flag, Type, scheme, dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      queryFooter: filter
      Uid: scope
      Flag: filter        # C.12 未定默认口径；本期默认 "0"
      Type: filter
      scheme: filter
      dates: filter
      datee: filter
    pagination: list_total
    supports_footer: true
    usage_category: payroll
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl, fhsl]
    related_keys: [uid, dept, id, huohao, worktype]

