    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao]

  - operation_id: HuohaoFormQuery
    path: /api/NetYf/Baseinfo/HuohaoFormQuery
    kind: resource
    resource: huohao_form
    required_params: [huohao]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      huohao: filter
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao]

  - operation_id: ScTypeQuery
    path: /api/NetYf/Baseinfo/ScTypeQuery
    kind: resource
    resource: sc_type
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: []

  - operation_id: RfidWorktypeQuery
    path: /api/NetYf/Baseinfo/RfidWorktypeQuery
    kind: resource
    resource: rfid_worktype
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
