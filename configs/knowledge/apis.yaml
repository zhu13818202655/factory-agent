  # ------------------------------------------------------ 生产计划与制单 (4)
  # 已弃用（2026-09-15 口径重梳，见 docs/design/进度与产量功能重梳方案.md）：
  # 订单数量改取「缝制生产进度」ScjdQuery.zsl，进度改取 ScjdQuery.wcl。
  # 保留登记条目并置 enabled: false（加载器允许存在、运行时拒绝调用）：条目仍在
  # mes_operation_category 种子与统计面的分类映射里，删条目会牵动两处计数。
  # Plan 的 khname / khid / dddh / finish_date 实测全空，客户/交期族列已整族删除。
  - operation_id: PlanGridPageList
    path: /api/NetYf/Plan/GridPageList
    kind: resource
    resource: plan
    enabled: false
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, jhdh, huohao]

  - operation_id: SclzdGridPageList
    path: /api/NetYf/Sclzd/GridPageList
    kind: resource
    resource: sclzd
    enabled: false   # 2026-10-11 V2 换代退役：id → dh 映射桥取消，订单维度改由 GongziClQuery/ScjdQuery V2 的 jhdh 直出
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, dddh, huohao, id]

  - operation_id: SclzdWorktypeQuery
    path: /api/NetYf/Sclzd/SclzdWorktypeQuery
    kind: resource
    resource: sclzd_worktype
    required_params: [dh]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      dh: filter
    pagination: none
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, wt]

  - operation_id: SclzdBarcodeQuery
    path: /api/NetYf/Sclzd/SclzdBarcodeQuery
    kind: resource
    resource: sclzd_barcode
    required_params: [dh, detailId]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      dh: filter
      detailId: filter
    pagination: none
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, id, uid]

  # ------------------------------------------------------------ 缝制进度 (4)
  # V2 取数重构（docs/design/V2接口取数重构与缓存加速方案.md，2026-10-11）：
  # 进度族主取数 = ``ScjdQuery`` V2（服务端 groupbyFields 聚合 + 不分页），
  # 合并原「缝制生产进度 / 详情 / 工序进度」三个 V1 接口；旧 V1 接口整体退役
  # （先置 enabled: false，不删登记条目——条目仍在 mes_operation_category 种子与
  # 统计面分类映射里）。进度族统一 usage_category: order（进度 = 订单维度）。
  - operation_id: ScjdQuery
    path: /api/NetYf/Sclzd/v2/ScjdQuery
    kind: resource
    resource: scjd_v2
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      dates: filter
      datee: filter
      # 业务过滤值全部由适配层从 NarrowedFilters 下推（订单/款号/物料编号），
      # 绝不来自模型文本；dh/jhdh 是等值过滤，chuanghao/color/chima 是模糊匹配。
      dh: filter
      jhdh: filter
      chuanghao: filter
      huohao: filter
      bbreed: filter
      worktype: filter
      wtname: filter
      uid: filter
      dept: filter
      # 服务端动态分组：List<string>，必须发 JSON 数组（发逗号拼接字符串会被判为
      # 参数非法）。排序参数（orderbyFields/orderByType）一律不下发——排序全部
      # 在 recipe 本地 SQL 完成（方案 §3.2⑤）。
      groupbyFields: filter
    pagination: none
    list_key: list
    usage_category: order
    timeout_seconds: 30.0
    sensitive_fields: []
    related_keys: [dh, jhdh, huohao]

  - operation_id: ScjdDetailQuery
    path: /api/NetYf/Sclzd/ScjdDetailQuery
    kind: resource
    resource: scjd_detail
    enabled: false   # 2026-10-11 V2 换代退役：包级下钻改由 ScjdQuery V2 的 dh 过滤承接
    # dh 来自 NarrowedFilters.order_codes（单订单场景），由适配层下推；与
    # HuohaoWtCLQuery.huohao 的服务端下推同法，业务值绝不来自模型文本。
    required_params: [dates, datee, dh]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
      dh: filter
    pagination: list_total
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [dh, id]

  - operation_id: ScjdGxQuery
    path: /api/NetYf/Sclzd/ScjdGxQuery
    kind: resource
    resource: scjd_gx
    enabled: false   # 2026-10-11 V2 换代退役：工序级下钻改由 ScjdQuery V2 的 userid 过滤承接
    # 客户契约无 page/size（一次返回该包全部已刷卡工序），也无 dates/datee；
    # 这两个参数未登记即被 _build_body 丢弃，不会误发。userid = 物料编号，
    # 来自 NarrowedFilters.material_ids（包级下钻到工序级）。
    required_params: [userid]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      userid: filter
      uid: scope
    pagination: none
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [userid, uid, worktype]

  - operation_id: ScjdFzHzQuery
    path: /api/NetYf/Sclzd/ScjdFzHzQuery
    kind: resource
    resource: scjd_fz_hz
    enabled: false   # 2026-10-11 V2 换代退役：缝制总进度由 ScjdQuery V2 聚合承接
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: order
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao, chuanghao]

  # -------------------------------------------------------- 产量与进度 (6)
  # 2026-10-11 V2 换代：产量族主源换为 GongziClQuery V2（工资产量，服务端聚合 +
  # 不分页）。YskQuery / HuohaoWtCLQuery 保留登记且保持启用，作为 V2 灰度期的
  # 三方对账锚点（方案附录 D.3）；BarcodeClQuery 退役。
  - operation_id: BarcodeClQuery
    path: /api/NetYf/Sclzd/BarcodeClQuery
    kind: resource
    resource: barcode_cl
    enabled: false   # 2026-10-11 V2 换代退役：YskQuery 的真子集，产量主源已换 GongziClQuery V2
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl, sssl]
    related_keys: [uid, dept, id, huohao, worktype]

  - operation_id: HuohaoWtCLQuery
    path: /api/NetYf/Sclzd/HuohaoWtCLQuery
    kind: resource
    resource: huohao_wt_cl
    required_params: [queryFooter, scheme, dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      queryFooter: filter
      scheme: filter
      dates: filter
      datee: filter
      # 2026-09-13 实测支持的服务端过滤（接口文档 §7.2）：huohao 取值是款号
      # bbreed；worktype 取值是工序名。单款号时由适配层下推 huohao。
      huohao: filter
      worktype: filter
    pagination: list_total
    supports_footer: true
    boolean_params: [queryFooter]
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: [sssl]
    related_keys: [huohao, worktype]

  - operation_id: PinFengGridPageList
    path: /api/NetYf/PinFeng/GridPageList
    kind: resource
    resource: pin_feng
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl, cp]
    related_keys: [uid, dept, dh, worktype]

  - operation_id: WorktypeProgressQuery
    path: /api/NetYf/Sclzd/WorktypeProgressQuery
    kind: resource
    resource: worktype_progress
    enabled: false   # 2026-10-11 V2 换代退役：与 ScjdGxQuery 同形，工序级下钻由 ScjdQuery V2 承接
    # customer doc says uid is optional (可为空); userid (material id)
    # is required. uid stays scope-sourced and is injected only when the scope
    # resolves to a single employee.
    required_params: [userid]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      userid: filter
      uid: scope
    pagination: list_total
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [userid, uid, worktype]

  - operation_id: YskQuery
    path: /api/NetYf/Sclzd/YskQuery
    kind: resource
    resource: ysk
    # Uid is scope-sourced and optional (factory-wide Ysk aggregations
    # call without a single employee; MES row-level filtering decides the range).
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      Uid: scope
      dates: filter
      datee: filter
    pagination: list_total
    supports_footer: true   # 无 queryFooter 入参但返回 footer
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl]
    related_keys: [uid, dept, id, huohao, worktype]

  - operation_id: WskQuery
    path: /api/NetYf/Sclzd/WskQuery
    kind: resource
    resource: wsk
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    supports_footer: true   # 无 queryFooter 入参但返回 footer
    usage_category: output
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [id, huohao, worktype]

  # ---------------------------------------------------------- 工资与排名 (2)
  # 2026-10-11 V2 换代：工资族主源 = GongziClQuery V2（工资产量，明细/汇总双模式，
  # 不分页）。GongziMxQuery / GongziJeOrderQuery 退役；GongziClQuery 对 00 员工
  # 不报无权限、静默返回本人范围（方案 §7.1 T9 实测），该族的服务端拒绝不可依赖，
  # 能力矩阵必须在本地拒绝 00（FR-004/008）。
  - operation_id: GongziClQuery
    path: /api/NetYf/Sclzd/v2/GongziClQuery
    kind: resource
    resource: gongzi_cl
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      dates: filter
      datee: filter
      # uid 来自 DataScope/NarrowedFilters（个人能力=本人、点名查人=目标工号），
      # 绝不来自模型文本；bbreed 取值是货号名称、wtname 是工序名称（服务端自动
      # 转编号过滤）；chuanghao 为模糊匹配。
      uid: filter
      dept: scope
      Flag: filter
      Type: filter
      bbreed: filter
      wtname: filter
      chuanghao: filter
      # List<string>，必须发 JSON 数组；不传 = 明细模式（工资族预取粒度）。
      groupbyFields: filter
    pagination: none   # 实测 page/size 未生效，符合条件的数据一次性全量返回
    list_key: list
    supports_footer: true
    usage_category: payroll
    # 全年明细一次拉取实测 48 s / 60 MB（老板视角预取成本），超时须覆盖最慢路径；
    # 交互路径（单日/单月）远低于此。
    timeout_seconds: 60.0
    sensitive_fields: [price, je, sl]
    related_keys: [uid, dept, jhdh, huohao, worktype]

  - operation_id: GongziMxQuery
    path: /api/NetYf/Sclzd/GongziMxQuery
    kind: resource
    resource: gongzi_mx
    enabled: false   # 2026-10-11 V2 换代退役：工资明细/汇总由 GongziClQuery V2 承接
    # Uid is scope-sourced and optional (客户确认 2026-09-06): 传员工工号按该员工
    # 查询；不传则由 MES 按当前角色过滤返回。产品端仅在单员工场景（个人本人/点名
    # 查某员工）注入 Uid，来源只能是 NarrowedFilters.employee_ids。
    required_params: [queryFooter, Flag, Type, scheme, dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      queryFooter: filter
      Uid: scope
      Flag: filter        # 日期口径：0 按扫描日期 / 1 按审核日期；默认 "0"（客户公共参数约定）
      Type: filter
      scheme: filter
      dates: filter
      datee: filter
    pagination: list_total
    boolean_params: [queryFooter]
    supports_footer: true
    usage_category: payroll
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl, fhsl]
    related_keys: [uid, dept, id, huohao, worktype]

  - operation_id: GongziJeOrderQuery
    path: /api/NetYf/Sclzd/GongziJeOrderQuery
    kind: resource
    resource: gongzi_je_order
    enabled: false   # 2026-10-11 V2 换代退役：工资排名由 GongziClQuery V2 的 uid/dept 分组承接
    required_params: [queryFooter, dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      queryFooter: filter
      dates: filter
      datee: filter
    pagination: list_total
    supports_footer: true
    usage_category: payroll
    boolean_params: [queryFooter]
    timeout_seconds: 10.0
    sensitive_fields: [je, bs, uname]
    related_keys: [uid, dept]

  # ------------------------------------------------------------------ 吊挂 (3)
  - operation_id: DgGridPageList
    path: /api/NetYf/Dg/GridPageList
    kind: resource
    resource: dg
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
    pagination: list_total
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [dg_Pwd, dg_Uid]
    related_keys: []

  - operation_id: DgZuGridPageList
    path: /api/NetYf/Dg/DgZuGridPageList
    kind: resource
    resource: dg_zu
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
    pagination: list_total
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: []

  - operation_id: DgClQuery
    path: /api/NetYf/Dg/DgClQuery
    kind: resource
    resource: dg_cl
    required_params: [dates, datee]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      page: filter
      size: filter
      dates: filter
      datee: filter
    pagination: list_total
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [price, je, sl]
    related_keys: [uid, dept, id, huohao, worktype]
