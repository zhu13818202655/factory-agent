# API Catalog: reviewed registry of approved MES operations.
# File changes are permission/semantics changes and require human review.
#
# 口径来源：``docs/product/AI问答对外接口-整理.md``（客户接口契约）与
# ``docs/product/需求及方案整理.md``（功能与确认结论）。
#
# - operation_id 采用客户接口名（契约形态）。
# - parameter_sources: credential（只能来自 MesCredentialBundle）/ scope（只能来自
#   DataScope）/ filter / clock。凭据参数绝不可来自 filter 或模型输出。
# - pagination: none 或 list_total（result.list/result.total，累计到 total 结束）。
#   2026-10-11 V2 换代：进度/产量/工资三族主取数已切到两个 V2 接口
#   （GongziClQuery / ScjdQuery v2 路径），声明 pagination: none（page/size 未生效）；
#   被 V2 覆盖的 V1 接口整体置 enabled: false 退役，YskQuery / HuohaoWtCLQuery
#   保留启用作灰度期三方对账锚点（docs/design/V2接口取数重构与缓存加速方案.md 附录 D）。
# - MoveMenuQuery 登记为 enabled: false：加载器允许存在但运行时拒绝调用。
# - usage_category: MES 调用统计的计费分类（口径见 docs/api/统计与运营接口.md）：
#   output（产量）/ payroll（工资）/ order（订单）/ other（其他：认证2+基础数据9+吊挂3）。
#   能力分类 ≠ API 分类，不得以 dimensions=capability 顶替。
version: 2
operations:
  # ------------------------------------------------------------ 认证与凭证 (2)
  - operation_id: SystemToken
    path: /api/system/token
    kind: identity
    enabled: true
    parameter_sources:
      app_key: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [access_token, sign, app_key]
    related_keys: []

  - operation_id: TestPermissions
    path: /api/print/test-permissions
    kind: identity
    enabled: true
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [sign, app_key]
    related_keys: []

  # ------------------------------------------------------------ 基础数据 (9)
  - operation_id: UserInfoQuery
    path: /api/NetYf/Baseinfo/UserInfoQuery
    kind: resource
    resource: user_info
    required_params: [USERNAME]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      USERNAME: filter
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [username]

  - operation_id: MoveMenuQuery
    path: /api/NetYf/Baseinfo/MoveMenuQuery
