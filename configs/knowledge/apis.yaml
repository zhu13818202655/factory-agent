# API Catalog: reviewed registry of approved MES operations (Story 5).
# File changes are permission/semantics changes and require human review.
#
# - operation_id 采用客户接口名（M13/M15 契约形态）。
# - parameter_sources: credential（只能来自 MesCredentialBundle）/ scope（只能来自
#   DataScope）/ filter / clock。凭据参数绝不可来自 filter 或模型输出。
# - pagination: none 或 list_total（result.list/result.total，累计到 total 结束，M13）。
# - MoveMenuQuery 登记为 enabled: false（K7）：加载器允许存在但运行时拒绝调用。
# - usage_category: MES 调用统计的计费分类（D1/D5，产品文档 §2.1）：
#   output（产量）/ payroll（工资）/ order（订单）/ other（其他：认证3+基础数据9+吊挂3）。
#   能力分类 ≠ API 分类，不得以 dimensions=capability 顶替（R2）。
version: 2
operations:
  # ------------------------------------------------------------ 认证与凭证 (3)
  - operation_id: SystemToken
    path: /api/system/token
    kind: identity
    enabled: true
    parameter_sources:
      app_key: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [access_token, sign, app_key]
    related_keys: []

  - operation_id: QuerySign
    path: /api/print/query-sign
    kind: identity
    enabled: true
    parameter_sources:
      app_key: credential
      timestamp: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [sign, app_key]
    related_keys: []

  - operation_id: TestPermissions
    path: /api/print/test-permissions
    kind: identity
    enabled: true
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [sign, app_key]
    related_keys: []

  # ------------------------------------------------------------ 基础数据 (9)
  - operation_id: UserInfoQuery
    path: /api/NetYf/Baseinfo/UserInfoQuery
    kind: resource
    resource: user_info
    required_params: [USERNAME]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      USERNAME: filter
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [username]

  - operation_id: MoveMenuQuery
    path: /api/NetYf/Baseinfo/MoveMenuQuery
    kind: resource
    resource: move_menu
    enabled: false   # K7: 当前版本不使用；运行时拒绝调用
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [uid]

  - operation_id: HuohaoQuery
    path: /api/NetYf/Baseinfo/HuohaoQuery
    kind: resource
    resource: huohao
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao]

  - operation_id: HuohaoFormQuery
    path: /api/NetYf/Baseinfo/HuohaoFormQuery
    kind: resource
    resource: huohao_form
    required_params: [huohao]
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      huohao: filter
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao]

  - operation_id: ScTypeQuery
    path: /api/NetYf/Baseinfo/ScTypeQuery
    kind: resource
    resource: sc_type
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: []

  - operation_id: RfidWorktypeQuery
    path: /api/NetYf/Baseinfo/RfidWorktypeQuery
    kind: resource
    resource: rfid_worktype
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [worktype]

  - operation_id: HuohaoWorktypeQuery
    path: /api/NetYf/Baseinfo/HuohaoWorktypeQuery
    kind: resource
    resource: huohao_worktype
    required_params: [huohao]
    parameter_sources:
