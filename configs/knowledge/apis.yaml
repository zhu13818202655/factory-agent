    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [huohao, worktype]

  - operation_id: EmployeeQuery
    path: /api/NetYf/Baseinfo/EmployeeQuery
    kind: resource
    resource: employee
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
      uid: scope
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: [movepassword, mobile, uname]
    related_keys: [uid, dept]

  - operation_id: DeptQuery
    path: /api/NetYf/Baseinfo/DeptQuery
    kind: resource
    resource: dept
    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
