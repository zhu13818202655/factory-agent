    parameter_sources:
      app_key: credential
      timestamp: credential
      sign: credential
    pagination: none
    usage_category: other
    timeout_seconds: 10.0
    sensitive_fields: []
    related_keys: [uid]

  - operation_id: HuohaoQuery
