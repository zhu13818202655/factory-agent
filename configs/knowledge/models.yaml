# Reviewed model deployment registry (ADR-0006).
#
# Business code only ever names a logical alias. Each alias resolves to an
# ordered list of OpenAI-compatible deployments; `fallbacks` names the aliases
# tried after every deployment of this alias has failed.
#
# API keys are NEVER written here. `api_key_env` names the environment variable
# holding the key, which the process resolves into a SecretStr at startup.
# A deployment whose `api_key_env` is unset is dropped with a warning, so a
# partially configured environment degrades instead of leaking a null key.
#
# Deployment topology (2026-09-04): all three tiers — fast / reasoning /
# summary — are served by ONE self-hosted Qwen3.8 endpoint. The three-tier
# split is retained as logical aliases (so per-tier routing, fallback chains and
# per-alias budgets survive unchanged), but they currently resolve to the same
# physical deployment.
#
# Optional DeepSeek v4 backup (2026-09-05): every alias also declares a
# priority-2 DeepSeek deployment that is skipped unless the environment
# provides FACTORY_AGENT_LLM_KEY_DEEPSEEK, so a Qwen-only environment is
# unchanged. Thinking policy is global and OFF by default
# (FACTORY_AGENT_LLM_THINKING_ENABLED / _EFFORT); the gateway emits the correct
# per-provider fields (Qwen chat_template_kwargs / DeepSeek thinking.type +
# reasoning_effort) for whichever family the alias routes to.
#
# `api_base_env` / `model_env` let the endpoint and model id be retargeted from
# the environment (see .env / .env.example) without editing this reviewed file.
# The values below are the checked-in defaults used whenever those variables are
# unset.

version: 1

aliases:
  - alias: factory-fast
    fallbacks: [factory-reasoning]
    deployments:
      - model: Qwen/Qwen3.8-27B-FP8
        api_base: http://117.184.148.14:21003/v1
        api_key_env: FACTORY_AGENT_LLM_API_KEY
        provider: openai
        model_env: FACTORY_AGENT_LLM_MODEL
        api_base_env: FACTORY_AGENT_LLM_API_BASE
        priority: 1
      - model: deepseek-v4-flash
        api_base: https://api.deepseek.com/v1
        api_key_env: FACTORY_AGENT_LLM_KEY_DEEPSEEK
        provider: deepseek
        priority: 2

  - alias: factory-reasoning
    fallbacks: []
    deployments:
      - model: Qwen/Qwen3.8-27B-FP8
        api_base: http://117.184.148.14:21003/v1
        api_key_env: FACTORY_AGENT_LLM_API_KEY
        provider: openai
        model_env: FACTORY_AGENT_LLM_MODEL
        api_base_env: FACTORY_AGENT_LLM_API_BASE
        priority: 1
      - model: deepseek-v4-flash
        api_base: https://api.deepseek.com/v1
        api_key_env: FACTORY_AGENT_LLM_KEY_DEEPSEEK
        provider: deepseek
        priority: 2

  - alias: factory-summary
    fallbacks: [factory-fast]
    deployments:
      - model: Qwen/Qwen3.8-27B-FP8
        api_base: http://117.184.148.14:21003/v1
        api_key_env: FACTORY_AGENT_LLM_API_KEY
        provider: openai
        model_env: FACTORY_AGENT_LLM_MODEL
        api_base_env: FACTORY_AGENT_LLM_API_BASE
        priority: 1
      - model: deepseek-v4-flash
        api_base: https://api.deepseek.com/v1
        api_key_env: FACTORY_AGENT_LLM_KEY_DEEPSEEK
        provider: deepseek
        priority: 2

# `provider: openai` is REQUIRED for this self-hosted vLLM endpoint. The served
# model id (`Qwen/Qwen3.8-27B-FP8`) has no LiteLLM provider mapping, and an
# unqualified id makes litellm Router construction fail with "LLM Provider NOT
# provided". The prefix selects litellm's OpenAI-compatible path, which is what
# a vLLM server speaks.
