# Reviewed L1 payroll list/statistics recipes. File changes are
# semantics changes and require human review.
#
# 口径来源：``docs/product/需求及方案整理.md`` 功能表与「客户确认结论」、
# ``docs/design/V2接口取数重构与缓存加速方案.md`` 附录 C.1（2026-10-11 换代）。
#
# FR-004 收入排名（"我在小组里排第几"，仅 01 组长 / 02 管理 / 99 老板）:
# GongziClQuery V2 **明细模式**取数（与工资族预取同参，命中老板缓存），
# 本地按人聚合 SUM(je) 后排名；计算层按本人工号（_meta.self_uid）定位名次与
# 金额，按本人所在小组（_meta.self_dept）过滤得到组内名次与组内总人数；
# 仅输出本人一行结果。
# **对 00 员工 V2 不报无权限、静默返回本人范围**（方案 §7.1 T9 实测），服务端
# 拒绝不可依赖——该能力的 00 拒绝由本地能力矩阵完成（permission_matrix.py）。
#
# FR-008 员工工资清单与排名: 与 FR-004/002/003/012 完全同参、同一预取底料
# （明细模式，附录 C.1 2026-10-11 二次拍板：原「服务端 [uid,uname,dept,deptname]
# 分组下推」实测 ~90s 且分组未被服务端执行，改为明细模式 + 本地聚合，方案
# §4.5 本地重聚合路径）；位次 = **本地排序后的先后**（排序不下发 MES，
# 方案 §3.2⑤）：rank_position 全厂/可见范围名次、group_rank 组内名次按 dept
# 分窗编号，两个窗口函数都必须显式以 ``uid ASC`` 打破并列（方案附录 G.5 最严重
# 两处）。部门名由 V2 ``deptname`` 直出，不再关联 DeptQuery（附录 B.5）。
#
# FR-011 全厂工资统计（修订）: ①GongziClQuery V2 **明细模式**取数（与预取同参），
# 本地按 dept 聚合 SUM(je) 得各车间/小组应发合计；②EmployeeQuery 不传 uid
# 全量返回（基础数据接口不按权限过滤，客户确认 4），按 dept 汇总得在册人数；
# ③部门名 V2 直出，不再关联 DeptQuery。人均工资 = 应发合计 ÷ 在册人数。
#
# FR-012 任一员工工资查询: 复用 FR-002 的 GongziClQuery V2 明细取数与本地合计
# 配方（不传 groupbyFields，与工资族预取粒度同底料），``uid`` 改为目标员工
# （由应用层经 EmployeeQuery 在当前租户解析后进入 NarrowedFilters，任何工资
# 调用前完成校验；解析不到或同名未定 uid 均零业务调用拒绝）。
version: 3
capabilities:
  - capability_id: fr004_group_income_rank
    title: 收入排名
    required_slots: [time_range]
    steps:
      - step_id: fetch_income
        kind: api
        operation_id: GongziClQuery
        # 明细模式（不传 groupbyFields）= 工资族预取粒度，FR-002/003/008/011/012
        # 同底料命中老板缓存；人员聚合在本地 compute 完成（2026-10-11 二次拍板）。
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: compute
        kind: local
        depends_on: [fetch_income]
        compute: |
          WITH visible AS (
            SELECT
              uid,
              uname,
              dept,
              SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) AS je
            FROM fetch_income
            GROUP BY uid, uname, dept
          ),
          overall_ranked AS (
            SELECT uid, ROW_NUMBER() OVER (ORDER BY je DESC, uid ASC) AS overall_pos
            FROM visible
          ),
          group_ranked AS (
            SELECT uid, ROW_NUMBER() OVER (ORDER BY je DESC, uid ASC) AS group_pos
            FROM visible
            WHERE dept = (SELECT self_dept FROM _meta)
          )
          SELECT
            CAST(o.overall_pos AS VARCHAR) AS rank_position,
            CAST(v.je AS VARCHAR) AS amount,
            CAST(g.group_pos AS VARCHAR) AS group_rank,
            CAST((SELECT COUNT(*) FROM group_ranked) AS VARCHAR) AS group_size
          FROM visible v
          JOIN overall_ranked o ON o.uid = v.uid
          LEFT JOIN group_ranked g ON g.uid = v.uid
          WHERE v.uid = (SELECT self_uid FROM _meta)
    result_columns:
      - name: rank_position
        title: 名次
        source_step: compute
        metric: payroll_rank_position
        column_type: quantity
      - name: amount
        title: 金额
        source_step: compute
        metric: payroll_amount
        column_type: money
        unit: 元
      - name: group_rank
        title: 组内名次
        source_step: compute
        metric: payroll_group_rank
        column_type: quantity
      - name: group_size
        title: 组内人数
        source_step: compute
        metric: payroll_group_size
        column_type: quantity
        unit: 人
    metric_versions:
      payroll_rank_position: factory-rank-v2
      payroll_amount: customer-payroll-v1
      payroll_group_rank: factory-rank-v2
      payroll_group_size: factory-rank-v2
    degradation: incomplete_marker
    card:
      kind: kpi
      metrics: [amount, rank_position, group_rank, group_size]

  - capability_id: fr008_payroll_ranking
    title: 员工工资清单与排名
    required_slots: [time_range]
    steps:
      - step_id: fetch_income
        kind: api
        operation_id: GongziClQuery
        # 与 FR-002/003/004/011/012 完全同参：同一预取底料、同一缓存条目
        # （明细模式，2026-10-11 二次拍板）；人员聚合在下方本地 compute 完成。
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: compute
        kind: local
        depends_on: [fetch_income]
        filter_bindings:
          requested_dept_ids: requested_dept_ids
        compute: |
          WITH requested_depts AS (
            SELECT unnest($requested_dept_ids) AS c
          ),
          ranked AS (
            SELECT
              uid,
              uname,
              dept,
              COALESCE(NULLIF(MAX(deptname), ''), dept) AS dept_name,
              CAST(CAST(SUM(CAST(COALESCE(TRY_CAST(bs AS DECIMAL), 0) AS DECIMAL)) AS DECIMAL)
                   AS VARCHAR) AS package_count,
              CAST(CAST(SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) AS DECIMAL)
                   AS VARCHAR) AS gross,
              CAST(ROW_NUMBER() OVER (ORDER BY
                   SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) DESC, uid ASC)
                   AS VARCHAR) AS rank_position,
              CAST(ROW_NUMBER() OVER (
                PARTITION BY dept ORDER BY
                SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) DESC, uid ASC)
                AS VARCHAR) AS group_rank
            FROM fetch_income
            WHERE (SELECT COUNT(*) FROM requested_depts) = 0
               OR dept IN (SELECT c FROM requested_depts)
            GROUP BY uid, uname, dept
          )
          SELECT
            uid,
            uname,
            dept,
            dept_name,
            package_count,
            gross,
            rank_position,
            group_rank
          FROM ranked
          ORDER BY CAST(gross AS DECIMAL) DESC, uid
    result_columns:
      - name: uid
        title: 工号
        source_step: compute
      - name: uname
        title: 姓名
        source_step: compute
      - name: dept
        title: 车间/小组
        source_step: compute
      - name: dept_name
        title: 小组名称
        source_step: compute
      - name: package_count
        title: 计件件数
        source_step: compute
        metric: payroll_package_count
        column_type: quantity
        unit: 件
      - name: gross
        title: 工资金额
        source_step: compute
        metric: payroll_amount
        column_type: money
        unit: 元
      - name: rank_position
        title: 名次
        source_step: compute
        metric: payroll_rank_position
        column_type: quantity
      - name: group_rank
        title: 组内名次
        source_step: compute
        metric: payroll_group_rank
        column_type: quantity
    metric_versions:
      payroll_package_count: customer-rank-v1
      payroll_amount: customer-payroll-v1
      payroll_rank_position: factory-rank-v2
      payroll_group_rank: factory-rank-v2
    degradation: incomplete_marker
    card:
      kind: ranking
      metrics: [gross]
      totals: [gross]
      preview_max_rows: 10
      preview_max_groups: 50
      group_by: dept
      group_name_from: dept_name
      rank_column: rank_position
      actions:
        - label: 查看该成员的工资
          capability_id: fr012_employee_payroll
          bind_from:
            employee_uid: uid

  - capability_id: fr011_factory_payroll_stats
    title: 全厂工资统计
    required_slots: [time_range]
    steps:
      - step_id: fetch_income
        kind: api
        operation_id: GongziClQuery
        # 明细模式（与预取同参）；部门聚合在本地 compute 完成（2026-10-11 二次拍板）。
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: fetch_employee
        kind: api
        operation_id: EmployeeQuery
        depends_on: [fetch_income]
      - step_id: compute
        kind: local
        depends_on: [fetch_income, fetch_employee]
        filter_bindings:
          requested_dept_ids: requested_dept_ids
        compute: |
          WITH requested_depts AS (
            SELECT unnest($requested_dept_ids) AS c
          ),
          wages AS (
            SELECT
              dept,
              COALESCE(NULLIF(MAX(deptname), ''), dept) AS dept_name,
              SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) AS total
            FROM fetch_income
            WHERE ((SELECT COUNT(*) FROM requested_depts) = 0
                   OR dept IN (SELECT c FROM requested_depts))
            GROUP BY dept
          ),
          headcounts AS (
            SELECT dept, COUNT(*) AS headcount
            FROM fetch_employee
            GROUP BY dept
          )
          SELECT
            w.dept AS dept_id,
            w.dept_name,
            CAST(w.total AS VARCHAR) AS gross_total,
            CAST(COALESCE(h.headcount, 0) AS VARCHAR) AS headcount,
            CASE WHEN COALESCE(h.headcount, 0) > 0
                 THEN CAST(ROUND(w.total / h.headcount, 2) AS VARCHAR)
                 ELSE 'unavailable' END AS avg_wage
          FROM wages w
          LEFT JOIN headcounts h ON h.dept = w.dept
          ORDER BY w.total DESC, w.dept
    result_columns:
      - name: dept_id
        title: 车间/小组编号
        source_step: compute
      - name: dept_name
        title: 车间/小组
        source_step: compute
      - name: gross_total
        title: 应发合计
        source_step: compute
        metric: payroll_gross_by_dept
        column_type: money
        unit: 元
      - name: headcount
        title: 在册人数
        source_step: compute
        metric: org_headcount
        column_type: quantity
        unit: 人
      - name: avg_wage
        title: 人均工资
        source_step: compute
        metric: payroll_avg_by_dept
        column_type: money
        unit: 元
    metric_versions:
      payroll_gross_by_dept: customer-footer-v1
      org_headcount: employee-registered-v1
      payroll_avg_by_dept: customer-payroll-avg-v1
    degradation: incomplete_marker
    aux_outputs:
      # 全厂级单值 KPI（不可 SUM 的口径）：人均工资 = Σ应发 ÷ Σ在册人数。
      # 只进卡片，不进主表与导出文件。
      - aux_id: factory_kpi
        into: metrics
        depends_on: [fetch_income, fetch_employee]
        metrics:
          - name: factory_gross_total
            title: 工资总额
            unit: 元
          - name: factory_avg_wage
            title: 人均工资
            unit: 元
          - name: factory_headcount
            title: 在册人数
            unit: 人
        compute: |
          WITH wages AS (
            SELECT dept, SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) AS total
            FROM fetch_income
            GROUP BY dept
          ),
          headcounts AS (
            SELECT dept, COUNT(*) AS headcount
            FROM fetch_employee
            GROUP BY dept
          ),
          totals AS (
            SELECT
              COALESCE((SELECT SUM(total) FROM wages), 0) AS gross_total,
              COALESCE((SELECT SUM(headcount) FROM headcounts), 0) AS headcount
          )
          SELECT
            CAST(ROUND(gross_total, 2) AS VARCHAR) AS factory_gross_total,
            CAST(headcount AS VARCHAR) AS factory_headcount,
            CASE WHEN headcount > 0
                 THEN CAST(ROUND(gross_total / headcount, 2) AS VARCHAR)
                 ELSE 'unavailable' END AS factory_avg_wage
          FROM totals
    card:
      kind: table
      metrics: []
      preview_max_rows: 10
      actions:
        - label: 查看该车间/小组的工资清单
          capability_id: fr008_payroll_ranking
          bind_from:
            dept_ids: dept_id

  - capability_id: fr012_employee_payroll
    title: 任一员工工资查询
    required_slots: [time_range]
    steps:
      - step_id: fetch_wages
        kind: api
        operation_id: GongziClQuery
        # 明细模式（不传 groupbyFields）= 工资族预取粒度，FR-002/003/012 同底料。
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: aggregate
        kind: local
        depends_on: [fetch_wages]
        compute: |
          SELECT
            CAST(COALESCE(SUM(CAST(je AS DECIMAL)), 0) AS VARCHAR) AS gross_total,
            CAST(COALESCE(SUM(CAST(sl AS DECIMAL)), 0) AS VARCHAR) AS piece_count
          FROM fetch_wages
    result_columns:
      - name: gross_total
        title: 计件工资合计
        source_step: aggregate
        metric: payroll_gross_total
        column_type: money
        unit: 元
      - name: piece_count
        title: 计件件数
        source_step: aggregate
        metric: payroll_piece_count
        column_type: quantity
        unit: 件
    metric_versions:
      payroll_gross_total: customer-footer-v1
      payroll_piece_count: customer-payroll-v1
    footer_reconciliation:
      gross_total: je_total
    degradation: incomplete_marker
    card:
      kind: kpi
      metrics: [gross_total, piece_count]
