# Reviewed L1 payroll list/statistics recipes. File changes are
# semantics changes and require human review.
#
# 口径来源：``docs/product/需求及方案整理.md`` 功能表与「客户确认结论」、
# ``docs/product/AI问答对外接口-整理.md``。
#
# FR-004 收入排名（员工"我在小组里排第几"）: GongziJeOrderQuery 返回当前角色
# 可见的排名列表（已按角色权限过滤，客户确认无需 MES 额外提供数据）；计算层
# 按本人工号（_meta.self_uid）定位名次与金额，按本人所在小组（_meta.self_dept）
# 过滤得到组内名次与组内总人数；仅输出本人一行结果。
#
# FR-008 员工工资清单与排名: GongziJeOrderQuery 已按 je 倒序返回（含 dept），
# 位次按返回顺序编号，可按 dept 分组呈现。同名员工以 uid 区分（卡片与
# Excel 同时展示 uid 与 uname）。
#
# FR-011 全厂工资统计（修订）: ①GongziJeOrderQuery 老板角色返回全厂排名列表，
# je 按 dept 汇总得各车间/小组应发合计；②EmployeeQuery 不传 uid 全量返回
# （基础数据接口不按权限过滤，客户确认 4），按 dept 汇总得在册人数；
# ③DeptQuery 解析部门名称。人均工资 = 应发合计 ÷ 在册人数。「有产出人数」
# 替代指标不再使用。
#
# FR-012 任一员工工资查询: 复用 FR-002 的 GongziMxQuery 汇总配方，Uid 改为目标
# 员工（由应用层经 EmployeeQuery 在当前租户解析后进入 NarrowedFilters，任何
# 工资调用前完成校验；解析不到或同名未定 uid 均零业务调用拒绝）。
# 老板可传空 Uid 查全部、管理传空不允许（客户确认），该规则由执行器在调用前强制。
version: 1
capabilities:
  - capability_id: fr004_group_income_rank
    title: 收入排名
    required_slots: [time_range]
    steps:
      - step_id: fetch_je_order
        kind: api
        operation_id: GongziJeOrderQuery
        params:
          queryFooter: "1"
      - step_id: compute
        kind: local
        depends_on: [fetch_je_order]
        compute: |
          WITH visible AS (
            SELECT uid, uname, dept, CAST(je AS DECIMAL) AS je
            FROM fetch_je_order
          ),
          overall_ranked AS (
            SELECT uid, ROW_NUMBER() OVER (ORDER BY je DESC, uid ASC) AS overall_pos
            FROM visible
          ),
          group_ranked AS (
            SELECT uid, ROW_NUMBER() OVER (ORDER BY je DESC, uid ASC) AS group_pos
            FROM visible
            WHERE dept = (SELECT self_dept FROM _meta)
          )
          SELECT
            CAST(o.overall_pos AS VARCHAR) AS rank_position,
            CAST(v.je AS VARCHAR) AS amount,
            CAST(g.group_pos AS VARCHAR) AS group_rank,
            CAST((SELECT COUNT(*) FROM group_ranked) AS VARCHAR) AS group_size
          FROM visible v
          JOIN overall_ranked o ON o.uid = v.uid
          LEFT JOIN group_ranked g ON g.uid = v.uid
          WHERE v.uid = (SELECT self_uid FROM _meta)
    result_columns:
      - name: rank_position
        source_step: compute
        metric: payroll_rank_position
        column_type: quantity
      - name: amount
        source_step: compute
        metric: payroll_amount
        column_type: money
        unit: 元
      - name: group_rank
        source_step: compute
        metric: payroll_group_rank
        column_type: quantity
      - name: group_size
        source_step: compute
        metric: payroll_group_size
        column_type: quantity
        unit: 人
    metric_versions:
      payroll_rank_position: factory-rank-v1
      payroll_amount: customer-payroll-v1
      payroll_group_rank: factory-group-rank-v1
      payroll_group_size: factory-group-rank-v1
    degradation: incomplete_marker

  - capability_id: fr008_payroll_ranking
    title: 员工工资清单与排名
    required_slots: [time_range]
    steps:
      - step_id: fetch_je_order
        kind: api
        operation_id: GongziJeOrderQuery
        params:
          queryFooter: "1"
      - step_id: compute
        kind: local
        depends_on: [fetch_je_order]
        filter_bindings:
          requested_dept_ids: requested_dept_ids
        compute: |
          WITH requested_depts AS (
            SELECT unnest($requested_dept_ids) AS c
          ),
          ranked AS (
            SELECT
              uid,
              uname,
              dept,
              bs,
              je
            FROM fetch_je_order
            WHERE (SELECT COUNT(*) FROM requested_depts) = 0
               OR dept IN (SELECT c FROM requested_depts)
          )
          SELECT
            uid,
            uname,
            dept,
            CAST(CAST(bs AS DECIMAL) AS VARCHAR) AS package_count,
            CAST(CAST(je AS DECIMAL) AS VARCHAR) AS gross,
            CAST(ROW_NUMBER() OVER (ORDER BY CAST(je AS DECIMAL) DESC) AS VARCHAR) AS rank_position
          FROM ranked
          ORDER BY CAST(je AS DECIMAL) DESC
    result_columns:
      - name: uid
        source_step: compute
      - name: uname
        source_step: compute
      - name: dept
        source_step: compute
      - name: package_count
        source_step: compute
        metric: payroll_package_count
        column_type: quantity
        unit: 包
      - name: gross
        source_step: compute
        metric: payroll_amount
        column_type: money
        unit: 元
      - name: rank_position
        source_step: compute
        metric: payroll_rank_position
        column_type: quantity
    metric_versions:
      payroll_package_count: customer-rank-v1
      payroll_amount: customer-payroll-v1
      payroll_rank_position: factory-rank-v1
    degradation: incomplete_marker

  - capability_id: fr011_factory_payroll_stats
    title: 全厂工资统计
    required_slots: [time_range]
    steps:
      - step_id: fetch_je_order
        kind: api
        operation_id: GongziJeOrderQuery
        params:
          queryFooter: "1"
      - step_id: fetch_employee
        kind: api
        operation_id: EmployeeQuery
        depends_on: [fetch_je_order]
      - step_id: fetch_dept
        kind: api
        operation_id: DeptQuery
        depends_on: [fetch_employee]
      - step_id: compute
        kind: local
        depends_on: [fetch_je_order, fetch_employee, fetch_dept]
        filter_bindings:
          requested_dept_ids: requested_dept_ids
        compute: |
          WITH requested_depts AS (
            SELECT unnest($requested_dept_ids) AS c
          ),
          wages AS (
            SELECT dept, SUM(CAST(je AS DECIMAL)) AS total
            FROM fetch_je_order
            WHERE ((SELECT COUNT(*) FROM requested_depts) = 0
                   OR dept IN (SELECT c FROM requested_depts))
            GROUP BY dept
          ),
          headcounts AS (
            SELECT dept, COUNT(*) AS headcount
            FROM fetch_employee
            GROUP BY dept
          )
          SELECT
            COALESCE(d.name, w.dept) AS dept_name,
            CAST(w.total AS VARCHAR) AS gross_total,
            CAST(COALESCE(h.headcount, 0) AS VARCHAR) AS headcount,
            CASE WHEN COALESCE(h.headcount, 0) > 0
                 THEN CAST(ROUND(w.total / h.headcount, 2) AS VARCHAR)
                 ELSE 'unavailable' END AS avg_wage
          FROM wages w
          LEFT JOIN fetch_dept d ON d.id = w.dept
          LEFT JOIN headcounts h ON h.dept = w.dept
          ORDER BY w.total DESC
    result_columns:
      - name: dept_name
        source_step: compute
      - name: gross_total
        source_step: compute
        metric: payroll_gross_by_dept
        column_type: money
        unit: 元
      - name: headcount
        source_step: compute
        metric: org_headcount
        column_type: quantity
        unit: 人
      - name: avg_wage
        source_step: compute
        metric: payroll_avg_by_dept
        column_type: money
        unit: 元
    metric_versions:
      payroll_gross_by_dept: customer-footer-v1
      org_headcount: employee-registered-v1
      payroll_avg_by_dept: customer-payroll-avg-v1
    degradation: incomplete_marker

  - capability_id: fr012_employee_payroll
    title: 任一员工工资查询
    required_slots: [time_range]
    steps:
      - step_id: fetch_wages
        kind: api
        operation_id: GongziMxQuery
        params:
          scheme: "hz"
          Type: "0,1,2"
          Flag: "0"
          queryFooter: "1"
      - step_id: aggregate
        kind: local
        depends_on: [fetch_wages]
        compute: |
          SELECT
            CAST(COALESCE(SUM(CAST(je AS DECIMAL)), 0) AS VARCHAR) AS gross_total,
            CAST(COALESCE(SUM(CAST(sl AS DECIMAL)), 0) AS VARCHAR) AS piece_count
          FROM fetch_wages
    result_columns:
      - name: gross_total
        source_step: aggregate
        metric: payroll_gross_total
        column_type: money
        unit: 元
      - name: piece_count
        source_step: aggregate
        metric: payroll_piece_count
        column_type: quantity
        unit: 件
    metric_versions:
      payroll_gross_total: customer-footer-v1
      payroll_piece_count: customer-payroll-v1
    footer_reconciliation:
      gross_total: je_total
    degradation: incomplete_marker
