# Reviewed L1 income ranking, payroll list and factory wage recipes.
# Wage data always uses shared GongziClQuery details (Flag=0, Type=0,1,2).
# Ranking sees the authorized population before selecting the trusted caller.
# Registered headcount uses the shared safe employee directory projection;
# wage participants cannot substitute employees with no output in the period.
# Employee and department queries remain subject to the capability-role matrix.
version: 4
capabilities:
  - capability_id: fr004_group_income_rank
    title: 收入排名
    required_slots: [time_range]
    steps:
      - step_id: fetch_income
        kind: api
        operation_id: GongziClQuery
        # 明细模式（不传 groupbyFields）= 工资族预取粒度，FR-002/003/008/011/012
        # 同底料命中老板缓存；人员聚合在本地 compute 完成。
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: fetch_employee
        kind: api
        operation_id: EmployeeQuery
        depends_on: [fetch_income]
      - step_id: compute
        kind: local
        depends_on: [fetch_income, fetch_employee]
        compute: |
          WITH roster_depts AS (
            SELECT CASE
              WHEN COUNT(*) = 1 AND COALESCE(MAX(dept), '') <> ''
              THEN MAX(dept) ELSE NULL END AS dept,
              uid
            FROM fetch_employee
            GROUP BY uid
          ),
          current_dept AS (
            SELECT dept FROM roster_depts
            WHERE uid = (SELECT self_uid FROM _meta)
              AND ((SELECT whole_tenant FROM _meta)
                   OR dept IN (SELECT dept_id FROM _dept_scope))
          ),
          visible AS (
            SELECT
              uid,
              SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) AS je
            FROM fetch_income
            GROUP BY uid
          ),
          group_known AS (
            SELECT (SELECT dept FROM current_dept) IS NOT NULL
              AND NOT EXISTS (
                SELECT 1 FROM visible v
                LEFT JOIN roster_depts r ON r.uid = v.uid
                WHERE r.dept IS NULL
              ) AS known
          ),
          overall_ranked AS (
            SELECT uid, ROW_NUMBER() OVER (ORDER BY je DESC, uid ASC) AS overall_pos
            FROM visible
          ),
          group_ranked AS (
            SELECT v.uid, ROW_NUMBER() OVER (ORDER BY v.je DESC, v.uid ASC) AS group_pos
            FROM visible v
            JOIN roster_depts r ON r.uid = v.uid
            WHERE r.dept = (SELECT dept FROM current_dept)
          )
          SELECT
            CAST(o.overall_pos AS VARCHAR) AS rank_position,
            CAST(v.je AS VARCHAR) AS amount,
            CASE WHEN (SELECT known FROM group_known)
                 THEN COALESCE(CAST(g.group_pos AS VARCHAR), 'unavailable')
                 ELSE 'unavailable' END AS group_rank,
            CASE WHEN (SELECT known FROM group_known)
                 THEN CAST((SELECT COUNT(*) FROM group_ranked) AS VARCHAR)
                 ELSE 'unavailable' END AS group_size
          FROM visible v
          JOIN overall_ranked o ON o.uid = v.uid
          LEFT JOIN group_ranked g ON g.uid = v.uid
          WHERE v.uid = (SELECT self_uid FROM _meta)
    result_columns:
      - name: rank_position
        title: 名次
        source_step: compute
        metric: payroll_rank_position
        column_type: quantity
      - name: amount
        title: 金额
        source_step: compute
        metric: payroll_amount
        column_type: money
        unit: 元
      - name: group_rank
        title: 组内名次
        source_step: compute
        metric: payroll_group_rank
        column_type: quantity
      - name: group_size
        title: 组内人数
        source_step: compute
        metric: payroll_group_size
        column_type: quantity
        unit: 人
    metric_versions:
      payroll_rank_position: factory-rank-v2
      payroll_amount: customer-payroll-v1
      payroll_group_rank: factory-rank-v2
      payroll_group_size: factory-rank-v2
    degradation: incomplete_marker
    card:
      kind: kpi
      metrics: [amount, rank_position, group_rank, group_size]

  - capability_id: fr008_payroll_ranking
    title: 员工工资清单与排名
    required_slots: [time_range]
    steps:
      - step_id: fetch_income
        kind: api
        operation_id: GongziClQuery
        # 与 FR-002/003/004/011/012 完全同参：同一预取底料、同一缓存条目
        # （明细模式）；人员聚合在下方本地 compute 完成。
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: compute
        kind: local
        depends_on: [fetch_income]
        filter_bindings:
          requested_dept_ids: requested_dept_ids
        compute: |
          WITH requested_depts AS (
            SELECT unnest($requested_dept_ids) AS c
          ),
          ranked AS (
            SELECT
              uid,
              uname,
              dept,
              COALESCE(NULLIF(MAX(deptname), ''), dept) AS dept_name,
              CAST(CAST(SUM(CAST(COALESCE(TRY_CAST(bs AS DECIMAL), 0) AS DECIMAL)) AS DECIMAL)
                   AS VARCHAR) AS package_count,
              CAST(CAST(SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) AS DECIMAL)
                   AS VARCHAR) AS gross,
              CAST(ROW_NUMBER() OVER (ORDER BY
                   SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) DESC, uid ASC)
                   AS VARCHAR) AS rank_position,
              CAST(ROW_NUMBER() OVER (
                PARTITION BY dept ORDER BY
                SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) DESC, uid ASC)
                AS VARCHAR) AS group_rank
            FROM fetch_income
            WHERE (SELECT COUNT(*) FROM requested_depts) = 0
               OR dept IN (SELECT c FROM requested_depts)
            GROUP BY uid, uname, dept
          )
          SELECT
            uid,
            uname,
            dept,
            dept_name,
            package_count,
            gross,
            rank_position,
            group_rank
          FROM ranked
          ORDER BY CAST(gross AS DECIMAL) DESC, uid
    result_columns:
      - name: uid
        title: 工号
        source_step: compute
      - name: uname
        title: 姓名
        source_step: compute
      - name: dept
        title: 车间/小组
        source_step: compute
      - name: dept_name
        title: 小组名称
        source_step: compute
      - name: package_count
        title: 计件件数
        source_step: compute
        metric: payroll_package_count
        column_type: quantity
        unit: 件
      - name: gross
        title: 工资金额
        source_step: compute
        metric: payroll_amount
        column_type: money
        unit: 元
      - name: rank_position
        title: 名次
        source_step: compute
        metric: payroll_rank_position
        column_type: quantity
      - name: group_rank
        title: 组内名次
        source_step: compute
        metric: payroll_group_rank
        column_type: quantity
    metric_versions:
      payroll_package_count: customer-rank-v1
      payroll_amount: customer-payroll-v1
      payroll_rank_position: factory-rank-v2
      payroll_group_rank: factory-rank-v2
    degradation: incomplete_marker
    card:
      kind: ranking
      metrics: [gross]
      totals: [gross]
      preview_max_rows: 10
      preview_max_groups: 50
      group_by: dept
      group_name_from: dept_name
      rank_column: rank_position
      actions:
        - label: 查看该成员的工资
          capability_id: fr012_employee_payroll
          bind_from:
            employee_uid: uid

  - capability_id: fr011_factory_payroll_stats
    title: 全厂工资统计
    required_slots: [time_range]
    steps:
      - step_id: fetch_income
        kind: api
        operation_id: GongziClQuery
        # 明细模式（与预取同参）；部门聚合在本地 compute 完成。
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: fetch_employee
        kind: api
        operation_id: EmployeeQuery
        depends_on: [fetch_income]
      - step_id: compute
        kind: local
        depends_on: [fetch_income, fetch_employee]
        filter_bindings:
          requested_dept_ids: requested_dept_ids
        compute: |
          WITH requested_depts AS (
            SELECT unnest($requested_dept_ids) AS c
          ),
          wages AS (
            SELECT
              dept,
              COALESCE(NULLIF(MAX(deptname), ''), dept) AS dept_name,
              SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) AS total
            FROM fetch_income
            WHERE ((SELECT COUNT(*) FROM requested_depts) = 0
                   OR dept IN (SELECT c FROM requested_depts))
            GROUP BY dept
          ),
          headcounts AS (
            SELECT dept, COUNT(*) AS headcount
            FROM fetch_employee
            GROUP BY dept
          )
          SELECT
            w.dept AS dept_id,
            w.dept_name,
            CAST(w.total AS VARCHAR) AS gross_total,
            CAST(COALESCE(h.headcount, 0) AS VARCHAR) AS headcount,
            CASE WHEN COALESCE(h.headcount, 0) > 0
                 THEN CAST(ROUND(w.total / h.headcount, 2) AS VARCHAR)
                 ELSE 'unavailable' END AS avg_wage
          FROM wages w
          LEFT JOIN headcounts h ON h.dept = w.dept
          ORDER BY w.total DESC, w.dept
    result_columns:
      - name: dept_id
        title: 车间/小组编号
        source_step: compute
      - name: dept_name
        title: 车间/小组
        source_step: compute
      - name: gross_total
        title: 应发合计
        source_step: compute
        metric: payroll_gross_by_dept
        column_type: money
        unit: 元
      - name: headcount
        title: 在册人数
        source_step: compute
        metric: org_headcount
        column_type: quantity
        unit: 人
      - name: avg_wage
        title: 人均工资
        source_step: compute
        metric: payroll_avg_by_dept
        column_type: money
        unit: 元
    metric_versions:
      payroll_gross_by_dept: customer-footer-v1
      org_headcount: employee-registered-v1
      payroll_avg_by_dept: customer-payroll-avg-v1
    degradation: incomplete_marker
    aux_outputs:
      # 全厂级单值 KPI（不可 SUM 的口径）：人均工资 = Σ应发 ÷ Σ在册人数。
      # 只进卡片，不进主表与导出文件。
      - aux_id: factory_kpi
        into: metrics
        depends_on: [fetch_income, fetch_employee]
        metrics:
          - name: factory_gross_total
            title: 工资总额
            unit: 元
          - name: factory_avg_wage
            title: 人均工资
            unit: 元
          - name: factory_headcount
            title: 在册人数
            unit: 人
        compute: |
          WITH wages AS (
            SELECT dept, SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) AS total
            FROM fetch_income
            GROUP BY dept
          ),
          headcounts AS (
            SELECT dept, COUNT(*) AS headcount
            FROM fetch_employee
            GROUP BY dept
          ),
          totals AS (
            SELECT
              COALESCE((SELECT SUM(total) FROM wages), 0) AS gross_total,
              COALESCE((SELECT SUM(headcount) FROM headcounts), 0) AS headcount
          )
          SELECT
            CAST(ROUND(gross_total, 2) AS VARCHAR) AS factory_gross_total,
            CAST(headcount AS VARCHAR) AS factory_headcount,
            CASE WHEN headcount > 0
                 THEN CAST(ROUND(gross_total / headcount, 2) AS VARCHAR)
                 ELSE 'unavailable' END AS factory_avg_wage
          FROM totals
    card:
      kind: table
      metrics: []
      preview_max_rows: 10
      actions:
        - label: 查看该车间/小组的工资清单
          capability_id: fr008_payroll_ranking
          bind_from:
            dept_ids: dept_id

  - capability_id: fr012_employee_payroll
    title: 任一员工工资查询
    required_slots: [time_range]
    steps:
      - step_id: fetch_wages
        kind: api
        operation_id: GongziClQuery
        # 明细模式（不传 groupbyFields）= 工资族预取粒度，FR-002/003/012 同底料。
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: aggregate
        kind: local
        depends_on: [fetch_wages]
        compute: |
          SELECT
            CAST(COALESCE(SUM(CAST(je AS DECIMAL)), 0) AS VARCHAR) AS gross_total,
            CAST(COALESCE(SUM(CAST(sl AS DECIMAL)), 0) AS VARCHAR) AS piece_count
          FROM fetch_wages
    result_columns:
      - name: gross_total
        title: 计件工资合计
        source_step: aggregate
        metric: payroll_gross_total
        column_type: money
        unit: 元
      - name: piece_count
        title: 计件件数
        source_step: aggregate
        metric: payroll_piece_count
        column_type: quantity
        unit: 件
    metric_versions:
      payroll_gross_total: customer-footer-v1
      payroll_piece_count: customer-payroll-v1
    footer_reconciliation:
      gross_total: je_total
    degradation: incomplete_marker
    card:
      kind: kpi
      metrics: [gross_total, piece_count]
