# Reviewed L1 personal output recipe.
# Data comes from the shared GongziClQuery detail dataset (Flag=0, Type=0,1,2).
# Scope filtering happens before sandbox loading; date/style/worktype totals
# and their deterministic ordering are computed locally. Quantity is the
# customer-confirmed qualified output sl, with defective quantity excluded.
version: 4
capabilities:
  - capability_id: fr001_personal_output
    title: 个人产量统计
    required_slots: [time_range]
    steps:
      - step_id: fetch_wages
        kind: api
        operation_id: GongziClQuery
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: aggregate
        kind: local
        depends_on: [fetch_wages]
        compute: |
          SELECT
            inputdate,
            huohao,
            COALESCE(NULLIF(wtname, ''), worktype) AS wtname,
            CAST(SUM(CAST(COALESCE(TRY_CAST(sl AS DECIMAL), 0) AS DECIMAL)) AS VARCHAR)
              AS output_qty
          FROM fetch_wages
          GROUP BY inputdate, huohao, COALESCE(NULLIF(wtname, ''), worktype)
          ORDER BY inputdate, huohao, COALESCE(NULLIF(wtname, ''), worktype)
    result_columns:
      - name: inputdate
        title: 日期
        source_step: aggregate
        column_type: date
      - name: huohao
        title: 款号
        source_step: aggregate
      - name: wtname
        title: 工序
        source_step: aggregate
      - name: output_qty
        title: 产量
        source_step: aggregate
        metric: output_personal
        column_type: quantity
        unit: 件
    metric_versions:
      output_personal: customer-output-v1
    degradation: incomplete_marker
    card:
      kind: table
      metrics: [output_qty]
      preview_max_rows: 10
