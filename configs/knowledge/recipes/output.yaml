# Reviewed L1 output recipe. File changes are semantics changes and
# require human review.
#
# 口径来源：``docs/product/需求及方案整理.md`` 员工功能表与「客户确认结论」、
# ``docs/product/AI问答对外接口-整理.md`` §8。
#
# FR-001 个人产量统计: personal output grouped by date x 货号 x 工序.
# Data source is GongziMxQuery (Type=0,1,2 三来源合并) with Uid scope-sourced
# from the credential; the quantity column is `sl`（客户确认：个人产量即实收数
# （合格数），次品不计）.
#
# 次品不在个人产量口径内（需求及方案整理·客户确认结论 2026-09-02：
# 「个人产量即最终实收数（合格数），次品不考虑」），结果列不含次品数量。
# 手工账接口（PinFeng/GridPageList 的 cp 字段）为未来独立次品能力预留。
version: 1
capabilities:
  - capability_id: fr001_personal_output
    title: 个人产量统计
    required_slots: [time_range]
    steps:
      - step_id: fetch_wages
        kind: api
        operation_id: GongziMxQuery
        params:
          scheme: ""
          Type: "0,1,2"
          Flag: "0"
          queryFooter: "1"
      - step_id: aggregate
        kind: local
        depends_on: [fetch_wages]
        compute: |
          SELECT
            rq,
            huohao,
            worktype,
            CAST(SUM(CAST(sl AS DECIMAL)) AS VARCHAR) AS output_qty
          FROM fetch_wages
          GROUP BY rq, huohao, worktype
          ORDER BY rq, huohao, worktype
    result_columns:
      - name: rq
        title: 日期
        source_step: aggregate
        column_type: date
      - name: huohao
        title: 款号
        source_step: aggregate
      - name: worktype
        title: 工序
        source_step: aggregate
      - name: output_qty
        title: 产量
        source_step: aggregate
        metric: output_personal
        column_type: quantity
        unit: 件
    metric_versions:
      output_personal: customer-output-v1
    degradation: incomplete_marker
    card:
      kind: table
      metrics: [output_qty]
      preview_max_rows: 10
