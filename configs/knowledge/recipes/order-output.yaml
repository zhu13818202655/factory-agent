# Reviewed L1 order output recipe. File changes are semantics changes
# and require human review.
#
# 口径来源：``docs/design/V2接口取数重构与缓存加速方案.md``（2026-10-11 换代，
# 附录 C.3 + §7 R3/T5 拍板）、``docs/api/工资产量-V2.md``、``docs/api/生产进度-V2.md``。
#
# 产量主源 = ``GongziClQuery`` V2（工资产量）：``groupbyFields`` 直接含 ``jhdh``，
# 取消 V1 的 ``SclzdGridPageList``（id → dh）映射桥与本地 JOIN（方案 C.3）。
# 行集粒度 = 「计划号 × 床号 × 款号 × 大货款号 × 工序 × 工序名 × uid」（C.3 表列出的
# 分组键 + 要点 1 的 uid）：数值列（sl/je）由服务端按组合计，``uid`` 拉进行集用于本地
# COUNT(DISTINCT)——footer 只有 sum/count 类合计、没有 COUNT DISTINCT，「参与人数」
# 必须在本地去重（方案 C.3 要点 1）。
#
# 订单维度按 ``jhdh`` 归组（R3 拍板）：有值按值归类、空值统一折叠为「未关联计划号」
# 同一组（不丢弃、不臆造、不用 dh 冒充）。
#
# 工序占比分母 = ``ScjdQuery`` V2 的 ``fhsl``（发卡数量，T5 拍板：V1 zsl 裁剪数量退役），
# 取「同计划号 Σfhsl」按 Σ分子/Σ分母 重算；它只用于算占比，不作为结果列输出——
# 结果是「订单×款号×工序」行，分母在这一粒度上会重复出现，一旦作为可求和列
# 就会按工序数被放大。
#
# 款号过滤（style_codes）同时匹配 ``huohao``（款号）与 ``bbreed``（大货款号）：
# 客户侧两种叫法并存（工资产量 V2 两个字段都有），宽松匹配避免口径词差导致空结果。
#
# ⚠ 「总产量」不能由各工序产量相加得出：同一件衣服做 3 道工序就有 3 条报工，
# 相加会按工序数放大。因此卡片只输出工件口径的产值与占比，并强制带口径注记。
#
# 排序本地做（§3.2⑤）：产量数值降序，并列以 order_code、worktype 升序打破（G.5）；
# 排序键不派生名次（本能力无名次列），只决定行序。
version: 3
capabilities:
  - capability_id: fr006_order_output
    title: 订单/款号产量
    required_slots: [time_range]
    steps:
      - step_id: fetch_cl
        kind: api
        operation_id: GongziClQuery
        params:
          Flag: "0"
          Type: "0,1,2"
          groupbyFields: [jhdh, chuanghao, huohao, bbreed, worktype, wtname, uid]
      - step_id: fetch_scjd
        kind: api
        operation_id: ScjdQuery
        depends_on: [fetch_cl]
        params:
          groupbyFields: [dh, jhdh, chuanghao, huohao, bbreed, dept, deptname]
      - step_id: compute
        kind: local
        depends_on: [fetch_cl, fetch_scjd]
        filter_bindings:
          order_codes: order_codes
          style_codes: style_codes
        compute: |
          WITH order_codes AS (
            SELECT unnest($order_codes) AS c
          ),
          style_codes AS (
            SELECT unnest($style_codes) AS c
          ),
          scoped AS (
            SELECT * FROM fetch_cl
            WHERE ((SELECT COUNT(*) FROM order_codes) = 0
                   OR COALESCE(jhdh, '') IN (SELECT c FROM order_codes))
              AND ((SELECT COUNT(*) FROM style_codes) = 0
                   OR COALESCE(huohao, '') IN (SELECT c FROM style_codes)
                   OR COALESCE(bbreed, '') IN (SELECT c FROM style_codes))
          ),
          -- 分母：同计划号 Σfhsl（发卡数量）。同样的槽位过滤保持与产量行集同范围，
          -- 款号在进度侧匹配 bbreed/huohao 两个字段（与产量侧同法）。
          issued AS (
            SELECT
              CASE WHEN COALESCE(jhdh, '') = '' THEN '未关联计划号' ELSE jhdh END
                AS order_code,
              SUM(CAST(COALESCE(TRY_CAST(fhsl AS DECIMAL), 0) AS DECIMAL)) AS issued_qty
            FROM fetch_scjd
            WHERE ((SELECT COUNT(*) FROM order_codes) = 0
                   OR COALESCE(jhdh, '') IN (SELECT c FROM order_codes))
              AND ((SELECT COUNT(*) FROM style_codes) = 0
                   OR COALESCE(bbreed, '') IN (SELECT c FROM style_codes)
                   OR COALESCE(huohao, '') IN (SELECT c FROM style_codes))
            GROUP BY 1
          ),
          agg AS (
            SELECT
              CASE WHEN COALESCE(jhdh, '') = '' THEN '未关联计划号' ELSE jhdh END
                AS order_code,
              COALESCE(NULLIF(huohao, ''), bbreed) AS style_code,
              COALESCE(NULLIF(wtname, ''), worktype) AS worktype,
              SUM(CAST(COALESCE(TRY_CAST(sl AS DECIMAL), 0) AS DECIMAL)) AS output_qty_num,
              SUM(CAST(COALESCE(TRY_CAST(je AS DECIMAL), 0) AS DECIMAL)) AS output_amount_num,
              COUNT(DISTINCT CASE WHEN COALESCE(uid, '') <> '' THEN uid END)
                AS participant_count
            FROM scoped
            GROUP BY 1, 2, 3
          )
          SELECT
            a.order_code,
            a.style_code,
            a.worktype,
            CAST(a.output_qty_num AS VARCHAR) AS output_qty,
            CAST(a.participant_count AS VARCHAR) AS participant_count,
            CAST(a.output_amount_num AS VARCHAR) AS output_amount,
            CASE WHEN COALESCE(i.issued_qty, 0) > 0
                 THEN CAST(ROUND(a.output_qty_num / i.issued_qty * 100, 2) AS VARCHAR)
                 ELSE 'unavailable' END AS output_share
          FROM agg a
          LEFT JOIN issued i ON i.order_code = a.order_code
          ORDER BY a.output_qty_num DESC, a.order_code, a.worktype
    result_columns:
      - name: order_code
        title: 订单号
        source_step: compute
      - name: style_code
        title: 款号
        source_step: compute
      - name: worktype
        title: 工序
        source_step: compute
      - name: output_qty
        title: 报工产量
        source_step: compute
        metric: output_reported_qty
        column_type: quantity
        unit: 件
      - name: participant_count
        title: 参与人数
        source_step: compute
        metric: output_participant_count
        column_type: quantity
        unit: 人
      - name: output_amount
        title: 报工金额
        source_step: compute
        metric: output_reported_amount
        column_type: money
        unit: 元
      - name: output_share
        title: 工序占比
        source_step: compute
        metric: output_worktype_share
        column_type: percent
        unit: "%"
    metric_versions:
      output_reported_qty: customer-cl-v2
      output_participant_count: factory-participant-v1
      output_reported_amount: customer-cl-v2
      output_worktype_share: factory-output-share-v2
    degradation: incomplete_marker
    card:
      kind: table
      metrics: [output_qty, output_amount]
      preview_max_rows: 10
      notes:
        - "「报工产量」是工序口径工作量（同一件衣服做 3 道工序就有 3 条报工），**不是完工件数**；卡片上的合计数同样是件·工序口径，不要当成做了多少件衣服。"
        - "「参与人数」是该订单×款号×工序下报工的去重人数，同一人在多道工序会分别计入。"
        - "「工序占比」= 该工序报工产量 ÷ 该订单发卡数量（同一计划号 Σ发卡），用于看哪道工序是瓶颈；它按订单各自的分母计算，不是全厂占比。"
        - "「订单号」取自计划号（jhdh）；未关联计划号的报工统一归入「未关联计划号」一组展示，不丢弃。"
        - "裁剪数量与包完工率在「订单/款号进度」里给（同一时间区间），本表不重复输出。"
