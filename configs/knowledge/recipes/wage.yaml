# Reviewed L1 personal wage recipes.
# GongziClQuery details use Flag=0 and Type=0,1,2 and share the owner's dataset.
# Caller scope is filtered before sandbox loading. Summary and detail outputs
# share these same rows; daily average is total divided by natural day count.
# Detail ordering is deterministic so cache and live final outputs can be compared.
# Footer reconciliation is diagnostic and never substitutes customer footer totals
# for the validated rows used in local computation.
version: 4
capabilities:
  - capability_id: fr002_personal_wage_summary
    title: 个人工资汇总
    required_slots: [time_range]
    steps:
      - step_id: fetch_wages
        kind: api
        operation_id: GongziClQuery
        # 明细模式（不传 groupbyFields）= 工资族预取粒度，FR-002/003/012 同底料。
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: aggregate
        kind: local
        depends_on: [fetch_wages]
        compute: |
          SELECT
            COALESCE(SUM(CAST(je AS DECIMAL)), 0) AS gross_total,
            COALESCE(SUM(CAST(sl AS DECIMAL)), 0) AS piece_count,
            CASE WHEN (SELECT days FROM _meta) > 0
                 THEN COALESCE(SUM(CAST(je AS DECIMAL)), 0) / (SELECT days FROM _meta)
                 ELSE 0 END AS daily_avg
          FROM fetch_wages
    result_columns:
      - name: gross_total
        title: 计件工资合计
        source_step: aggregate
        metric: payroll_gross_total
        column_type: money
        unit: 元
      - name: piece_count
        title: 计件件数
        source_step: aggregate
        metric: payroll_piece_count
        column_type: quantity
        unit: 件
      - name: daily_avg
        title: 日均工资
        source_step: aggregate
        metric: payroll_daily_average
        column_type: money
        unit: 元
    metric_versions:
      payroll_gross_total: customer-footer-v1
      payroll_piece_count: customer-payroll-v1
      payroll_daily_average: factory-daily-average-v1
    footer_reconciliation:
      gross_total: je_total
    degradation: incomplete_marker
    card:
      kind: kpi
      metrics: [gross_total, piece_count, daily_avg]

  - capability_id: fr003_personal_wage_detail
    title: 个人工资明细
    required_slots: [time_range]
    steps:
      - step_id: fetch_wages
        kind: api
        operation_id: GongziClQuery
        params:
          Flag: "0"
          Type: "0,1,2"
      - step_id: ordered_detail
        kind: local
        depends_on: [fetch_wages]
        compute: |
          SELECT inputdate, huohao, wtname, sl, price, je
          FROM fetch_wages
          ORDER BY inputdate, huohao, wtname, price, sl, je, id
    result_columns:
      - name: inputdate
        title: 日期
        source_step: ordered_detail
        column_type: date
      - name: huohao
        title: 款号
        source_step: ordered_detail
      - name: wtname
        title: 工序
        source_step: ordered_detail
      - name: sl
        title: 完成数量
        source_step: ordered_detail
        metric: payroll_piece_count
        column_type: quantity
        unit: 件
      - name: price
        title: 工价单价
        source_step: ordered_detail
        metric: payroll_unit_price
        column_type: money
        unit: 元
      - name: je
        title: 小计金额
        source_step: ordered_detail
        metric: payroll_amount
        column_type: money
        unit: 元
    metric_versions:
      payroll_piece_count: customer-payroll-v1
      payroll_unit_price: customer-payroll-v1
      payroll_amount: customer-payroll-v1
    footer_reconciliation:
      gross_total: je_total
    degradation: incomplete_marker
    card:
      kind: table
      metrics: [je]
      preview_max_rows: 10
      notes:
        - "日期列是报工录入日期。"
