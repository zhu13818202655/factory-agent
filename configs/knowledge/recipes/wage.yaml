# Reviewed L1 wage capability recipes. File changes are semantics
# changes and require human review.
#
# 口径来源：``docs/product/需求及方案整理.md`` 功能表与「客户确认结论」、
# ``docs/product/AI问答对外接口-整理.md`` §8。
#
# FR-002 个人工资汇总 and FR-003 个人工资明细 share the same operation
# `GongziMxQuery` and differ only in `scheme` and result columns:
#   - both fetch detail rows (scheme empty); FR-003 renders them as 明细 rows,
#     FR-002 aggregates them locally into 汇总 columns.
# 真实 MES 联调发现（2026-09-06，差异台账待客户确认）：汇总模式 scheme=hz 的
# 行结构与接口文档 §8.1 不符，且其 footer 只反映首行数值（bs_total=行数、
# fhsl_total/sl_total/je_total=首行对应值），合计不可信。因此工资汇总/明细
# 统一用 scheme="" 明细取数，gross_total/piece_count 以本地合计为准，
# footer.je_total 仅在明细口径下参与对账。
# The `Type=0,1,2` three-source merge covers 扫码/吊挂/手工账 (客户口径).
# `Flag` defaults to "0" (扫描日期；客户公共参数约定).
# `Uid` is scope-sourced and never accepts user input; 选填（客户确认 2026-09-06）：
# 传工号查该员工，不传则由 MES 按当前角色过滤（00=本人；组长/管理/老板=管辖范围）。
# 产品端只在单员工场景（个人本人/点名查某员工）注入 Uid，不再做「仅限老板传空」门禁。
#
# Local compute runs inside the per-interaction read-only DuckDB sandbox. The
# kernel registers a `_meta` table with the natural-day count; `daily_avg`
# is a factory-defined versioned rule (合计 ÷ 区间自然日天数), not a customer
# formula, and is surfaced as an assumption label.
#
# footer_reconciliation compares the locally aggregated `gross_total` against
# the MES `footer.je_total`; a mismatch is a structured `reconciliation_failed`,
# never a silently chosen number.
version: 1
capabilities:
  - capability_id: fr002_personal_wage_summary
    title: 个人工资汇总
    required_slots: [time_range]
    steps:
      - step_id: fetch_wages
        kind: api
        operation_id: GongziMxQuery
        # scheme 为空 = 明细取数（真实 MES hz 汇总有缺陷，见文件头注释）。
        params:
          scheme: ""
          Type: "0,1,2"
          Flag: "0"
          queryFooter: "1"
      - step_id: aggregate
        kind: local
        depends_on: [fetch_wages]
        compute: |
          SELECT
            COALESCE(SUM(CAST(je AS DECIMAL)), 0) AS gross_total,
            COALESCE(SUM(CAST(sl AS DECIMAL)), 0) AS piece_count,
            CASE WHEN (SELECT days FROM _meta) > 0
                 THEN COALESCE(SUM(CAST(je AS DECIMAL)), 0) / (SELECT days FROM _meta)
                 ELSE 0 END AS daily_avg
          FROM fetch_wages
    result_columns:
      - name: gross_total
        source_step: aggregate
        metric: payroll_gross_total
        column_type: money
      - name: piece_count
        source_step: aggregate
        metric: payroll_piece_count
        column_type: quantity
      - name: daily_avg
        source_step: aggregate
        metric: payroll_daily_average
        column_type: money
    metric_versions:
      payroll_gross_total: customer-footer-v1
      payroll_piece_count: customer-payroll-v1
      payroll_daily_average: factory-daily-average-v1
    footer_reconciliation:
      gross_total: je_total
    degradation: incomplete_marker

  - capability_id: fr003_personal_wage_detail
    title: 个人工资明细
    required_slots: [time_range]
    steps:
      - step_id: fetch_wages
        kind: api
        operation_id: GongziMxQuery
        params:
          scheme: ""
          Type: "0,1,2"
          Flag: "0"
          queryFooter: "1"
      - step_id: aggregate
        kind: local
        depends_on: [fetch_wages]
        compute: |
          SELECT
            COALESCE(COUNT(*), 0) AS piece_count,
            COALESCE(SUM(CAST(je AS DECIMAL)), 0) AS gross_total
          FROM fetch_wages
    result_columns:
      - name: rq
        source_step: fetch_wages
        column_type: date
      - name: worktype
        source_step: fetch_wages
      - name: sl
        source_step: fetch_wages
        metric: payroll_piece_count
        column_type: quantity
      - name: price
        source_step: fetch_wages
        metric: payroll_unit_price
        column_type: money
      - name: je
        source_step: fetch_wages
        metric: payroll_amount
        column_type: money
    metric_versions:
      payroll_piece_count: customer-payroll-v1
      payroll_unit_price: customer-payroll-v1
      payroll_amount: customer-payroll-v1
    footer_reconciliation:
      gross_total: je_total
    degradation: incomplete_marker
