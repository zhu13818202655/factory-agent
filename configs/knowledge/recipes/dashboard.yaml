# Reviewed L1 factory output dashboard recipe. File changes are semantics
# changes and require human review.
#
# 口径来源：``docs/design/V2接口取数重构与缓存加速方案.md``（2026-10-11 换代，
# 附录 C.2/C.3 + §7 T5 拍板）、``docs/api/工资产量-V2.md``、``docs/api/生产进度-V2.md``。
#
# FR-013 全厂产量总览（综合看板，仅老板）：一张卡片同时给出
# ① KPI 区（总产量 / 在产订单 / 人均月产）、② 日产量柱状图、③ 车间产量排名。
# 主表 = 车间排名（口径与 fr007 一致，但名次恒输出——看板场景不做 N=1 置空）；
# KPI 与日序列走 ``aux_outputs``（只进卡片，不进主表与导出文件）。
#
# 取数 = ``GongziClQuery`` V2 单次调用：``groupbyFields=[inputdate, dept, deptname,
# bbreed, uid]`` 是 C.3 表 FR-013 两行（日序列 [inputdate]（或 +dept）× 车间排名
# 同 FR-007 [dept, deptname, bbreed]）的并集粒度，再按 C.3 要点 1 拉入 ``uid``——
# 主表排名、日序列、人均分母全部由本地重聚合得到，串行接口数 4 → 3（方案 §10 效率表）。
# ``EmployeeQuery`` 保留（在册人数）；``ScjdQuery`` V2 保留（在产订单 KPI）。
#
# 在产订单口径（D-2 拍板 + T1 换代）：包完工率 wcl = sssl ÷ fhsl（实收 ÷ 发卡），
# 「在产」= 同一制单（dh）Σ实收 < Σ发卡（与列表层「按 Σ分子/Σ分母 重算」同法，
# 绝不对行级 wcl 取平均或直接去重行计数）。取不到（窗口无缝制记录）时该 KPI
# 输出「暂无数据源」，不伪造 0。
#
# 人均月产 = ΣGongziClQuery.sl ÷ 在册人数（EmployeeQuery 全量行数）。
#
# 排序本地做（§3.2⑤）：产量降序，行序以 dept_id 升序打破（G.5 显式 tie-break）。
version: 2
capabilities:
  - capability_id: fr013_factory_output_dashboard
    title: 全厂产量总览
    required_slots: [time_range]
    steps:
      - step_id: fetch_cl
        kind: api
        operation_id: GongziClQuery
        params:
          Flag: "0"
          Type: "0,1,2"
          groupbyFields: [inputdate, dept, deptname, bbreed, uid]
      - step_id: fetch_scjd
        kind: api
        operation_id: ScjdQuery
        depends_on: [fetch_cl]
        params:
          groupbyFields: [dh, jhdh, chuanghao, huohao, bbreed, dept, deptname]
      - step_id: fetch_employee
        kind: api
        operation_id: EmployeeQuery
        depends_on: [fetch_scjd]
      - step_id: compute
        kind: local
        depends_on: [fetch_cl]
        compute: |
          WITH agg AS (
            SELECT
              dept AS dept_id,
              COALESCE(NULLIF(deptname, ''), dept) AS dept_name,
              SUM(CAST(COALESCE(TRY_CAST(sl AS DECIMAL), 0) AS DECIMAL)) AS output_qty_num,
              COUNT(DISTINCT CASE WHEN COALESCE(uid, '') <> '' THEN uid END)
                AS participant_count
            FROM fetch_cl
            WHERE COALESCE(dept, '') <> ''
            GROUP BY 1, 2
          )
          SELECT
            CAST(RANK() OVER (ORDER BY output_qty_num DESC) AS VARCHAR) AS rank_position,
            dept_id,
            dept_name,
            CAST(output_qty_num AS VARCHAR) AS output_qty,
            CAST(participant_count AS VARCHAR) AS participant_count,
            CASE WHEN participant_count > 0
                 THEN CAST(output_qty_num / CAST(participant_count AS DECIMAL) AS VARCHAR)
                 ELSE 'unavailable' END AS per_capita
          FROM agg
          ORDER BY output_qty_num DESC, dept_id
    result_columns:
      - name: rank_position
        title: 名次
        source_step: compute
        metric: workshop_rank
      - name: dept_id
        title: 车间/小组编号
        source_step: compute
      - name: dept_name
        title: 车间/小组
        source_step: compute
      - name: output_qty
        title: 报工产量
        source_step: compute
        metric: output_reported_qty
        column_type: quantity
        unit: 件
      - name: participant_count
        title: 参与人数
        source_step: compute
        metric: workshop_effective_headcount
        column_type: quantity
        unit: 人
      - name: per_capita
        title: 人均产量
        source_step: compute
        metric: workshop_output_per_capita
        column_type: quantity
        unit: 件/人
    metric_versions:
      workshop_rank: factory-rank-v2
      output_reported_qty: customer-cl-v2
      workshop_effective_headcount: factory-effective-headcount-v1
      workshop_output_per_capita: factory-per-capita-v1
    degradation: incomplete_marker
    aux_outputs:
      # 全厂级单值 KPI：总产量 / 在产订单（D-2 口径 + T1 换代）/ 人均月产。
      - aux_id: factory_kpi
        into: metrics
        depends_on: [fetch_cl, fetch_scjd, fetch_employee]
        metrics:
          - name: total_output
            title: 总产量
            unit: 件
          - name: active_orders
            title: 在产订单
            unit: 单
          - name: per_capita_output
            title: 人均月产
            unit: 件/人
        compute: |
          WITH outputs AS (
            SELECT COALESCE(SUM(CAST(COALESCE(TRY_CAST(sl AS DECIMAL), 0) AS DECIMAL)), 0)
              AS total_output
            FROM fetch_cl
          ),
          -- 在产 = 同一制单 Σ实收 < Σ发卡（wcl = Σsssl ÷ Σfhsl < 100%，按 Σ 重算口径）。
          active AS (
            SELECT COUNT(*) AS cnt FROM (
              SELECT dh,
                     SUM(CAST(COALESCE(TRY_CAST(fhsl AS DECIMAL), 0) AS DECIMAL)) AS issued_qty,
                     SUM(CAST(COALESCE(TRY_CAST(sssl AS DECIMAL), 0) AS DECIMAL)) AS received_qty
              FROM fetch_scjd
              GROUP BY dh
            ) per_sheet
            WHERE per_sheet.received_qty < per_sheet.issued_qty
          ),
          roster AS (
            SELECT COUNT(*) AS headcount FROM fetch_employee
          )
          SELECT
            CAST(ROUND(total_output, 0) AS VARCHAR) AS total_output,
            CAST((SELECT cnt FROM active) AS VARCHAR) AS active_orders,
            CASE WHEN (SELECT headcount FROM roster) > 0
                 THEN CAST(CAST(ROUND(total_output / (SELECT headcount FROM roster), 0) AS BIGINT) AS VARCHAR)
                 ELSE 'unavailable' END AS per_capita_output
          FROM outputs
      # 日产量序列（柱状图）：点数超过 62 时由卡片构建层自动降为周粒度。
      - aux_id: daily_series
        into: chart
        depends_on: [fetch_cl]
        chart_type: bar
        chart_unit: 件
        label_column: label
        value_column: value
        compute: |
          SELECT
            inputdate AS label,
            CAST(ROUND(SUM(CAST(COALESCE(TRY_CAST(sl AS DECIMAL), 0) AS DECIMAL)), 0) AS VARCHAR) AS value
          FROM fetch_cl
          WHERE COALESCE(inputdate, '') <> ''
          GROUP BY inputdate
          ORDER BY label
    card:
      kind: ranking
      metrics: []
      totals: [output_qty]
      preview_max_rows: 10
      rank_column: rank_position
      actions:
        - label: 查看该车间/小组的产量明细
          capability_id: fr010_workshop_output_overview
          bind_from:
            dept_ids: dept_id
      notes:
        - "「报工产量」是 Σ 报工数量，按工序累计：同一件衣服做 3 道工序就有 3 条报工，因此它是工序口径工作量，不是完工件数。"
        - "「在产订单」是统计窗内实收数量尚未达到发卡数量（完成率不到 100%）的制单去重数；「人均月产」= 总产量 ÷ 在册人数。"
        - "点击车间行可继续查看该车间按款号的产量明细。"
