# Reviewed L1 capability recipes. File changes are semantics changes and
# require human review. Real business capability recipes live in their own
# per-capability files; this file ships the minimal EmployeeQuery + DeptQuery
# smoke recipe.
version: 1
capabilities:
  - capability_id: smoke_piecework_summary
    title: Minimal employee and workshop lookup (kernel smoke baseline)
    required_slots: []
    steps:
      - step_id: fetch_employee
        kind: api
        operation_id: EmployeeQuery
      - step_id: fetch_depts
        kind: api
        operation_id: DeptQuery
        parallel_group: lookups
    result_columns:
      - name: qualified_quantity_total
        source_step: fetch_employee
        metric: output_personal
      - name: amount_total
        source_step: fetch_depts
        metric: org_headcount
    metric_versions:
      output_personal: customer-output-v1
      org_headcount: employee-registered-v1
    degradation: incomplete_marker
