# Reviewed L1 production progress and drill-down recipes.
# The shared fine-grained progress dataset retains sheet, package, material,
# employee, department and worktype dimensions. The data source filters scope
# and request conditions and projects each reviewed groupbyFields grain before
# sandbox loading. Local ratios use sum(received)/sum(issued), never an average
# of row ratios. Order dimensions use jhdh; empty plans share one group.
version: 7
capabilities:
  - capability_id: fr005_order_progress
    title: 订单/款号进度
    required_slots:
      - time_range
    steps:
      - step_id: fetch_scjd
        kind: api
        operation_id: ScjdQuery
        params:
          groupbyFields:
            - dh
            - jhdh
            - chuanghao
            - huohao
            - bbreed
            - dept
            - deptname
      - step_id: compute
        kind: local
        depends_on:
          - fetch_scjd
        filter_bindings:
          order_codes: order_codes
          style_codes: style_codes
          plan_codes: plan_codes
        compute: |
          WITH order_codes AS (SELECT unnest($order_codes) AS c),
          style_codes AS (SELECT unnest($style_codes) AS c),
          plan_codes AS (SELECT unnest($plan_codes) AS c),
          scoped AS (
            SELECT * FROM fetch_scjd
            WHERE ((SELECT COUNT(*) FROM order_codes) = 0 OR COALESCE(jhdh, '') IN (SELECT c FROM order_codes))
              AND ((SELECT COUNT(*) FROM style_codes) = 0 OR bbreed IN (SELECT c FROM style_codes))
          AND ((SELECT COUNT(*) FROM plan_codes) = 0 OR COALESCE(jhdh, '') IN (SELECT c FROM plan_codes))
          AND (NOT (SELECT filter_dept FROM _meta) OR dept IN (SELECT dept_id FROM _dept_scope))
          AND ((SELECT order_view_kind FROM _meta) = ''
               OR ((SELECT order_view_kind FROM _meta) = 'unlinked' AND TRIM(COALESCE(jhdh, '')) = '')
               OR ((SELECT order_view_kind FROM _meta) = 'plan' AND jhdh = (SELECT order_view_plan FROM _meta)))
          ),
          dated AS (
            SELECT
              CASE WHEN TRIM(COALESCE(jhdh, '')) = '' THEN NULL ELSE jhdh END AS plan_code,
              CASE WHEN TRIM(COALESCE(dh, '')) = '' THEN NULL ELSE dh END AS sheet_code,
              NULLIF(huohao, '') AS style_code, NULLIF(bbreed, '') AS style_name,
              NULLIF(chuanghao, '') AS bed_code,
              CAST(TRY_CAST(rq AS DATE) AS VARCHAR) AS created_date,
              CAST(COALESCE(TRY_CAST(bs AS DECIMAL), 0) AS DECIMAL) AS bs,
              CAST(COALESCE(TRY_CAST(fhsl AS DECIMAL), 0) AS DECIMAL) AS fhsl,
              CAST(COALESCE(TRY_CAST(sssl AS DECIMAL), 0) AS DECIMAL) AS sssl,
              CAST(COALESCE(TRY_CAST(wts AS DECIMAL), 0) AS DECIMAL) AS wts
            FROM scoped
          ),
          per_sheet AS (
            SELECT plan_code, sheet_code,
              CASE WHEN COUNT(style_code) = COUNT(*) AND COUNT(DISTINCT style_code) = 1 THEN MIN(style_code) END AS style_code,
              CASE WHEN COUNT(style_name) = COUNT(*) AND COUNT(DISTINCT style_name) = 1 THEN MIN(style_name) END AS style_name,
              CASE WHEN COUNT(bed_code) = COUNT(*) AND COUNT(DISTINCT bed_code) = 1 THEN MIN(bed_code) END AS bed_code,
              CASE WHEN COUNT(created_date) = COUNT(*) AND COUNT(DISTINCT created_date) = 1 THEN MIN(created_date) END AS created_date,
              SUM(bs) AS package_count, SUM(fhsl) AS issued_qty, SUM(sssl) AS received_qty, SUM(wts) AS worktype_count
            FROM dated GROUP BY plan_code, sheet_code
          ),
          sheet_states AS (
            SELECT *,
              CASE WHEN sheet_code IS NULL OR issued_qty <= 0 THEN '无法判断'
                   WHEN received_qty >= issued_qty THEN '已完工' ELSE '未完工' END AS finish_state
            FROM per_sheet
          )
          , per_plan AS (
            SELECT plan_code, CAST(COUNT(sheet_code) AS DECIMAL) AS sheet_count,
              SUM(package_count) AS package_count, SUM(issued_qty) AS issued_qty,
              SUM(received_qty) AS received_qty, SUM(worktype_count) AS worktype_count,
              SUM(CASE WHEN sheet_code IS NOT NULL AND finish_state = '已完工' THEN 1 ELSE 0 END) AS finished_sheet_count,
              SUM(CASE WHEN sheet_code IS NOT NULL AND finish_state = '未完工' THEN 1 ELSE 0 END) AS unfinished_sheet_count,
              SUM(CASE WHEN sheet_code IS NOT NULL AND finish_state = '无法判断' THEN 1 ELSE 0 END) AS unavailable_sheet_count,
              SUM(CASE WHEN sheet_code IS NULL THEN 1 ELSE 0 END) AS missing_sheet_rows
            FROM sheet_states GROUP BY plan_code
          )
          SELECT COALESCE(plan_code, '未关联计划号') AS order_code,
            plan_code, plan_code IS NULL AS plan_missing,
            CAST(1 AS VARCHAR) AS order_count, CAST(sheet_count AS VARCHAR) AS sheet_count,
            CAST(package_count AS VARCHAR) AS package_count, CAST(issued_qty AS VARCHAR) AS issued_qty,
            CAST(received_qty AS VARCHAR) AS received_qty,
            CAST(CASE WHEN issued_qty > 0 THEN ROUND(received_qty / issued_qty * 100, 2) ELSE 0 END AS VARCHAR) AS progress_ratio,
            CASE WHEN issued_qty <= 0 THEN '暂无发卡'
                 WHEN unfinished_sheet_count > 0 AND received_qty < issued_qty AND ROUND(received_qty / issued_qty * 100, 2) = 100
                   THEN '接近100%（仍有未完工）'
                 WHEN unfinished_sheet_count > 0
                   THEN CONCAT(CAST(ROUND(received_qty / issued_qty * 100, 2) AS VARCHAR), '%（仍有未完工）')
                 WHEN unavailable_sheet_count > 0 OR missing_sheet_rows > 0
                   THEN CONCAT(CAST(ROUND(received_qty / issued_qty * 100, 2) AS VARCHAR), '%（部分制单无法判断）')
                 ELSE CONCAT(CAST(ROUND(received_qty / issued_qty * 100, 2) AS VARCHAR), '%')
                 END AS progress_label,
            CAST(worktype_count AS VARCHAR) AS worktype_count,
            CAST(finished_sheet_count AS VARCHAR) AS finished_sheet_count,
            CAST(unfinished_sheet_count AS VARCHAR) AS unfinished_sheet_count,
            CAST(unavailable_sheet_count AS VARCHAR) AS unavailable_sheet_count,
            CASE WHEN unfinished_sheet_count > 0 THEN '未完工'
                 WHEN unavailable_sheet_count > 0 OR missing_sheet_rows > 0 THEN '无法判断'
                 WHEN finished_sheet_count > 0 THEN '全部完工' ELSE '无法判断' END AS finish_state
          FROM per_plan ORDER BY plan_code NULLS LAST
    result_columns:
      - name: order_code
        title: 计划号
        source_step: compute
      - name: plan_code
        title: 计划号标识
        source_step: compute
      - name: plan_missing
        title: 未关联计划号
        source_step: compute
      - name: order_count
        title: 订单统计组数
        source_step: compute
        metric: progress_order_count
        column_type: quantity
        unit: 组
      - name: sheet_count
        title: 制单数
        source_step: compute
        metric: progress_sheet_count
        column_type: quantity
        unit: 单
      - name: package_count
        title: 包数
        source_step: compute
        metric: progress_package_count
        column_type: quantity
        unit: 包
      - name: issued_qty
        title: 发卡数量
        source_step: compute
        metric: progress_issued_qty
        column_type: quantity
        unit: 件
      - name: received_qty
        title: 实收数量
        source_step: compute
        metric: progress_received_qty
        column_type: quantity
        unit: 件
      - name: progress_ratio
        title: 进度数值
        source_step: compute
        metric: progress_package_ratio
        column_type: percent
        unit: '%'
      - name: progress_label
        title: 进度
        source_step: compute
      - name: worktype_count
        title: 工序数
        source_step: compute
        metric: progress_worktype_count
        column_type: quantity
        unit: 道
      - name: finished_sheet_count
        title: 已完工制单
        source_step: compute
        metric: progress_finished_sheet_count
        column_type: quantity
        unit: 单
      - name: unfinished_sheet_count
        title: 未完工制单
        source_step: compute
        metric: progress_unfinished_sheet_count
        column_type: quantity
        unit: 单
      - name: unavailable_sheet_count
        title: 无法判断制单
        source_step: compute
        metric: progress_unavailable_sheet_count
        column_type: quantity
        unit: 单
      - name: finish_state
        title: 状态
        source_step: compute
    metric_versions:
      progress_order_count: factory-progress-v2
      progress_sheet_count: factory-progress-v1
      progress_package_count: customer-progress-v2
      progress_issued_qty: customer-progress-v2
      progress_package_ratio: customer-progress-v2
      progress_worktype_count: customer-progress-v2
      progress_received_qty: customer-progress-v2
      progress_finished_sheet_count: factory-sheet-state-v1
      progress_unfinished_sheet_count: factory-sheet-state-v1
      progress_unavailable_sheet_count: factory-sheet-state-v1
    degradation: incomplete_marker
    card:
      kind: table
      metrics:
        - sheet_count
        - package_count
        - issued_qty
        - finished_sheet_count
        - unfinished_sheet_count
        - unavailable_sheet_count
      preview_max_rows: 10
      notes:
        - 一行一个计划号统计组；空计划号统一归入「未关联计划号」，该组不代表一个已确认的真实订单。
        - 展开组内制单可查看款式、床号、创建日期和各自进度；制单按真实非空制单号计数，跨部门不重复。
        - 组进度 = Σ累计实收 ÷ Σ发卡 × 100；状态逐制单判断，超收不能抵消其他制单未完工。
        - 发卡为零时数值进度按客户口径为零，但完工状态无法判断；接近100%的未完工制单不会标成已完工。
        - 实收是截至数据更新时间的累计量；历史月份筛选当月创建的制单，不能解释为当月新做的量。
        - 制单包明细使用真实制单号，物料工序明细使用物料编号；显示名称不能代替查询标识。
      hidden_columns:
        - plan_code
        - plan_missing
        - order_count
        - progress_ratio
    aux_outputs:
      - aux_id: sheet_details
        into: details
        title: 制单进度
        group_by: plan_code
        status_column: finish_state
        hidden_columns:
          - plan_code
          - plan_missing
          - style_name
          - progress_ratio
        actions:
          - label: 查看包明细
            capability_id: fr005_order_package_detail
            bind_from:
              order_codes: sheet_code
        depends_on:
          - fetch_scjd
        filter_bindings:
          order_codes: order_codes
          style_codes: style_codes
          plan_codes: plan_codes
        columns:
          - name: plan_code
            title: 计划号标识
            source_step: fetch_scjd
          - name: plan_missing
            title: 未关联计划号
            source_step: fetch_scjd
          - name: sheet_code
            title: 制单号
            source_step: fetch_scjd
          - name: style_code
            title: 款式编码
            source_step: fetch_scjd
          - name: style_name
            title: 款号
            source_step: fetch_scjd
          - name: style_label
            title: 款式
            source_step: fetch_scjd
          - name: bed_code
            title: 床号
            source_step: fetch_scjd
          - name: created_date
            title: 制单日期
            source_step: fetch_scjd
            column_type: date
          - name: package_count
            title: 包数
            source_step: fetch_scjd
            metric: progress_package_count
            column_type: quantity
            unit: 包
          - name: issued_qty
            title: 发卡数量
            source_step: fetch_scjd
            metric: progress_issued_qty
            column_type: quantity
            unit: 件
          - name: received_qty
            title: 实收数量
            source_step: fetch_scjd
            metric: progress_received_qty
            column_type: quantity
            unit: 件
          - name: progress_ratio
            title: 进度数值
            source_step: fetch_scjd
            metric: progress_package_ratio
            column_type: percent
            unit: '%'
          - name: progress_label
            title: 进度
            source_step: fetch_scjd
          - name: worktype_count
            title: 工序数
            source_step: fetch_scjd
            metric: progress_worktype_count
            column_type: quantity
            unit: 道
          - name: finish_state
            title: 状态
            source_step: fetch_scjd
        compute: |
          WITH order_codes AS (SELECT unnest($order_codes) AS c),
          style_codes AS (SELECT unnest($style_codes) AS c),
          plan_codes AS (SELECT unnest($plan_codes) AS c),
          scoped AS (
            SELECT * FROM fetch_scjd
            WHERE ((SELECT COUNT(*) FROM order_codes) = 0 OR COALESCE(jhdh, '') IN (SELECT c FROM order_codes))
              AND ((SELECT COUNT(*) FROM style_codes) = 0 OR bbreed IN (SELECT c FROM style_codes))
          AND ((SELECT COUNT(*) FROM plan_codes) = 0 OR COALESCE(jhdh, '') IN (SELECT c FROM plan_codes))
          AND (NOT (SELECT filter_dept FROM _meta) OR dept IN (SELECT dept_id FROM _dept_scope))
          AND ((SELECT order_view_kind FROM _meta) = ''
               OR ((SELECT order_view_kind FROM _meta) = 'unlinked' AND TRIM(COALESCE(jhdh, '')) = '')
               OR ((SELECT order_view_kind FROM _meta) = 'plan' AND jhdh = (SELECT order_view_plan FROM _meta)))
          ),
          dated AS (
            SELECT
              CASE WHEN TRIM(COALESCE(jhdh, '')) = '' THEN NULL ELSE jhdh END AS plan_code,
              CASE WHEN TRIM(COALESCE(dh, '')) = '' THEN NULL ELSE dh END AS sheet_code,
              NULLIF(huohao, '') AS style_code, NULLIF(bbreed, '') AS style_name,
              NULLIF(chuanghao, '') AS bed_code,
              CAST(TRY_CAST(rq AS DATE) AS VARCHAR) AS created_date,
              CAST(COALESCE(TRY_CAST(bs AS DECIMAL), 0) AS DECIMAL) AS bs,
              CAST(COALESCE(TRY_CAST(fhsl AS DECIMAL), 0) AS DECIMAL) AS fhsl,
              CAST(COALESCE(TRY_CAST(sssl AS DECIMAL), 0) AS DECIMAL) AS sssl,
              CAST(COALESCE(TRY_CAST(wts AS DECIMAL), 0) AS DECIMAL) AS wts
            FROM scoped
          ),
          per_sheet AS (
            SELECT plan_code, sheet_code,
              CASE WHEN COUNT(style_code) = COUNT(*) AND COUNT(DISTINCT style_code) = 1 THEN MIN(style_code) END AS style_code,
              CASE WHEN COUNT(style_name) = COUNT(*) AND COUNT(DISTINCT style_name) = 1 THEN MIN(style_name) END AS style_name,
              CASE WHEN COUNT(bed_code) = COUNT(*) AND COUNT(DISTINCT bed_code) = 1 THEN MIN(bed_code) END AS bed_code,
              CASE WHEN COUNT(created_date) = COUNT(*) AND COUNT(DISTINCT created_date) = 1 THEN MIN(created_date) END AS created_date,
              SUM(bs) AS package_count, SUM(fhsl) AS issued_qty, SUM(sssl) AS received_qty, SUM(wts) AS worktype_count
            FROM dated GROUP BY plan_code, sheet_code
          ),
          sheet_states AS (
            SELECT *,
              CASE WHEN sheet_code IS NULL OR issued_qty <= 0 THEN '无法判断'
                   WHEN received_qty >= issued_qty THEN '已完工' ELSE '未完工' END AS finish_state
            FROM per_sheet
          )
          SELECT plan_code, plan_code IS NULL AS plan_missing,
            sheet_code, style_code, style_name, COALESCE(style_name, style_code, '款式待确认') AS style_label,
            bed_code, created_date,
            CAST(package_count AS VARCHAR) AS package_count, CAST(issued_qty AS VARCHAR) AS issued_qty,
            CAST(received_qty AS VARCHAR) AS received_qty,
            CAST(CASE WHEN issued_qty > 0 THEN ROUND(received_qty / issued_qty * 100, 2) ELSE 0 END AS VARCHAR) AS progress_ratio,
            CASE WHEN issued_qty <= 0 THEN '暂无发卡'
                 WHEN finish_state = '未完工' AND ROUND(received_qty / issued_qty * 100, 2) = 100 THEN '接近100%'
                 ELSE CONCAT(CAST(ROUND(received_qty / issued_qty * 100, 2) AS VARCHAR), '%') END AS progress_label,
            CAST(worktype_count AS VARCHAR) AS worktype_count, finish_state
          FROM sheet_states
          ORDER BY plan_code NULLS LAST,
            CASE finish_state WHEN '未完工' THEN 0 WHEN '无法判断' THEN 1 ELSE 2 END,
            sheet_code NULLS LAST
