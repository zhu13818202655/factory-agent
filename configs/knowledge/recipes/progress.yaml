# Reviewed L1 production progress and drill-down recipes.
# The shared fine-grained progress dataset retains sheet, package, material,
# employee, department and worktype dimensions. The data source filters scope
# and request conditions and projects each reviewed groupbyFields grain before
# sandbox loading. Local ratios use sum(received)/sum(issued), never an average
# of row ratios. Order dimensions use jhdh; empty plans share one group.
version: 5
capabilities:
  - capability_id: fr005_order_progress
    title: 订单/款号进度
    required_slots: [time_range]
    steps:
      - step_id: fetch_scjd
        kind: api
        operation_id: ScjdQuery
        params:
          groupbyFields: [dh, jhdh, chuanghao, huohao, bbreed, dept, deptname]
      - step_id: compute
        kind: local
        depends_on: [fetch_scjd]
        filter_bindings:
          order_codes: order_codes
          style_codes: style_codes
        compute: |
          WITH order_codes AS (
            SELECT unnest($order_codes) AS c
          ),
          style_codes AS (
            SELECT unnest($style_codes) AS c
          ),
          scoped AS (
            SELECT * FROM fetch_scjd
            WHERE ((SELECT COUNT(*) FROM order_codes) = 0
                   OR COALESCE(jhdh, '') IN (SELECT c FROM order_codes))
              AND ((SELECT COUNT(*) FROM style_codes) = 0
                   OR bbreed IN (SELECT c FROM style_codes))
          ),
          dated AS (
            SELECT
              CASE WHEN TRIM(COALESCE(jhdh, '')) = '' THEN NULL ELSE jhdh END AS plan_code,
              NULLIF(dh, '') AS sheet_code,
              NULLIF(bbreed, '') AS style_code,
              NULLIF(chuanghao, '') AS bed_code,
              CASE WHEN LENGTH(COALESCE(dh, '')) >= 8
                        AND TRY_CAST(SUBSTR(dh, 1, 8) AS INTEGER) IS NOT NULL
                   THEN CONCAT(SUBSTR(dh, 1, 4), '-', SUBSTR(dh, 5, 2), '-',
                               SUBSTR(dh, 7, 2))
                   ELSE NULL END AS created_date,
              CAST(COALESCE(TRY_CAST(bs AS DECIMAL), 0) AS DECIMAL) AS bs,
              CAST(COALESCE(TRY_CAST(fhsl AS DECIMAL), 0) AS DECIMAL) AS fhsl,
              CAST(COALESCE(TRY_CAST(sssl AS DECIMAL), 0) AS DECIMAL) AS sssl,
              CAST(COALESCE(TRY_CAST(wts AS DECIMAL), 0) AS DECIMAL) AS wts
            FROM scoped
          ),
          per_plan AS (
            SELECT
              plan_code,
              CASE WHEN COUNT(sheet_code) = COUNT(*) AND COUNT(DISTINCT sheet_code) = 1
                   THEN MIN(sheet_code) END AS sheet_code,
              CASE WHEN COUNT(style_code) = COUNT(*) AND COUNT(DISTINCT style_code) = 1
                   THEN MIN(style_code) END AS style_code,
              CASE WHEN COUNT(bed_code) = COUNT(*) AND COUNT(DISTINCT bed_code) = 1
                   THEN MIN(bed_code) END AS bed_code,
              CASE WHEN COUNT(created_date) = COUNT(*) AND COUNT(DISTINCT created_date) = 1
                   THEN MIN(created_date) END AS created_date,
              CAST(1 AS DECIMAL) AS order_count,
              CAST(COUNT(DISTINCT sheet_code) AS DECIMAL) AS sheet_count,
              SUM(bs) AS package_count,
              SUM(fhsl) AS issued_qty,
              SUM(sssl) AS received_qty,
              SUM(wts) AS worktype_count
            FROM dated
            GROUP BY plan_code
          )
          SELECT
            COALESCE(plan_code, '未关联计划号') AS order_code,
            sheet_code,
            style_code,
            bed_code,
            created_date,
            CAST(order_count AS VARCHAR) AS order_count,
            CAST(sheet_count AS VARCHAR) AS sheet_count,
            CAST(package_count AS VARCHAR) AS package_count,
            CAST(issued_qty AS VARCHAR) AS issued_qty,
            CAST(CASE WHEN issued_qty > 0
                      THEN ROUND(received_qty / issued_qty * 100, 2)
                      ELSE 0 END AS VARCHAR) AS progress_ratio,
            CAST(worktype_count AS VARCHAR) AS worktype_count,
            CASE WHEN issued_qty > 0 AND received_qty >= issued_qty
                 THEN '已完工' ELSE '未完工' END AS finish_state
          FROM per_plan
          ORDER BY plan_code NULLS LAST
    result_columns:
      - name: order_code
        title: 订单号
        source_step: compute
      - name: sheet_code
        title: 制单号
        source_step: compute
      - name: style_code
        title: 款号
        source_step: compute
      - name: bed_code
        title: 床号
        source_step: compute
      - name: created_date
        title: 制单日期
        source_step: compute
        column_type: date
      - name: order_count
        title: 订单统计组数
        source_step: compute
        metric: progress_order_count
        column_type: quantity
        unit: 组
      - name: sheet_count
        title: 制单数
        source_step: compute
        metric: progress_sheet_count
        column_type: quantity
        unit: 单
      - name: package_count
        title: 包数
        source_step: compute
        metric: progress_package_count
        column_type: quantity
        unit: 包
      - name: issued_qty
        title: 发卡数量
        source_step: compute
        metric: progress_issued_qty
        column_type: quantity
        unit: 件
      - name: progress_ratio
        title: 进度
        source_step: compute
        metric: progress_package_ratio
        column_type: percent
        unit: "%"
      - name: worktype_count
        title: 工序数
        source_step: compute
        metric: progress_worktype_count
        column_type: quantity
        unit: 道
      - name: finish_state
        title: 状态
        source_step: compute
    metric_versions:
      progress_order_count: factory-progress-v2
      progress_sheet_count: factory-progress-v1
      progress_package_count: customer-progress-v2
      progress_issued_qty: customer-progress-v2
      progress_package_ratio: customer-progress-v2
      progress_worktype_count: customer-progress-v2
    degradation: incomplete_marker
    card:
      kind: table
      metrics: [order_count, sheet_count, package_count, issued_qty]
      preview_max_rows: 10
      notes:
        - "「进度」列 = 累计实收数量 ÷ 发卡数量 × 100。"
        - "一行一个计划号统计组；空计划号统一归入「未关联计划号」。订单统计组数包含该空值组，不代表它有已确认的计划号；制单数按不同制单号计数。"
        - "制单号、款号、床号、制单日期仅在组内唯一且完整时展示；多值或缺失时留空，不取一个值代表整组。"
        - "「制单日期」由制单号前 8 位派生；「发卡数量」是组内各制单的发卡贡献合计。多制单组需指定真实制单号才能查询该制单的包明细。"
        - "款号仅筛选参与汇总的数据，不拆分计划号统计组；进度按 Σ实收 ÷ Σ发卡 重算，工序数为客户贡献合计。"

  - capability_id: fr009_factory_order_overview
    title: 全厂订单进度总览
    required_slots: [time_range]
    steps:
