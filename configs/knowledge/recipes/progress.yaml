                        AND TRY_CAST(SUBSTR(dh, 1, 8) AS INTEGER) IS NOT NULL
                   THEN CONCAT(SUBSTR(dh, 1, 4), '-', SUBSTR(dh, 5, 2), '-',
                               SUBSTR(dh, 7, 2))
                   ELSE NULL END AS created_date,
              CAST(COALESCE(TRY_CAST(bs AS DECIMAL), 0) AS DECIMAL) AS bs,
              CAST(COALESCE(TRY_CAST(fhsl AS DECIMAL), 0) AS DECIMAL) AS fhsl,
              CAST(COALESCE(TRY_CAST(sssl AS DECIMAL), 0) AS DECIMAL) AS sssl,
              CAST(COALESCE(TRY_CAST(wts AS DECIMAL), 0) AS DECIMAL) AS wts
            FROM scoped
          ),
          per_plan AS (
            SELECT
              plan_code,
              CASE WHEN COUNT(sheet_code) = COUNT(*) AND COUNT(DISTINCT sheet_code) = 1
                   THEN MIN(sheet_code) END AS sheet_code,
              CASE WHEN COUNT(style_code) = COUNT(*) AND COUNT(DISTINCT style_code) = 1
                   THEN MIN(style_code) END AS style_code,
              CASE WHEN COUNT(bed_code) = COUNT(*) AND COUNT(DISTINCT bed_code) = 1
                   THEN MIN(bed_code) END AS bed_code,
              CASE WHEN COUNT(created_date) = COUNT(*) AND COUNT(DISTINCT created_date) = 1
                   THEN MIN(created_date) END AS created_date,
              CAST(1 AS DECIMAL) AS order_count,
              CAST(COUNT(DISTINCT sheet_code) AS DECIMAL) AS sheet_count,
              SUM(bs) AS package_count,
