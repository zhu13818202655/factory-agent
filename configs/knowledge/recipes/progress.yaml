          FROM per_plan
          ORDER BY plan_code NULLS LAST
    result_columns:
      - name: order_code
        title: 订单号
        source_step: compute
      - name: sheet_code
        title: 制单号
        source_step: compute
      - name: style_code
        title: 款号
        source_step: compute
      - name: bed_code
