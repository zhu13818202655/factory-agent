apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usage-admin
  template:
    metadata:
      labels:
        app: usage-admin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: usage-admin
          image: usage-admin:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8020
              name: http
          envFrom:
            - configMapRef:
                name: factory-agent-config
          env:
            - name: USAGE_ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: factory-agent-secrets
                  key: USAGE_ADMIN_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: usage-admin
spec:
  selector:
    app: usage-admin
  ports:
    - name: http
      port: 8020
      targetPort: http
