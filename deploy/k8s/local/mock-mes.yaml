apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-mes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-mes
  template:
    metadata:
      labels:
        app: mock-mes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: mock-mes
          image: mock-mes:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
              name: http
          envFrom:
            - configMapRef:
                name: factory-agent-config
          env:
            - name: MOCK_MES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: factory-agent-secrets
                  key: MOCK_MES_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-mes
spec:
  selector:
    app: mock-mes
  ports:
    - name: http
      port: 8010
      targetPort: http
