name: factory-agent

services:
  agent-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: factory-agent:dev
    environment:
      FACTORY_AGENT_ENV: development
      FACTORY_AGENT_HOST: 0.0.0.0
      FACTORY_AGENT_PORT: 8000
    ports:
      - "${FACTORY_AGENT_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
