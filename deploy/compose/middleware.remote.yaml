# 固定测试配置；在此文件所在目录执行：
# docker compose --env-file /dev/null -f middleware.remote.yaml up -d --wait
name: factory-agent-middleware-remote

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "0.0.0.0:3432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/init-databases.sql
        target: /docker-entrypoint-initdb.d/10-init-databases.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: factory_agent_dev
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - factory_agent_dev
    ports:
      - "0.0.0.0:3379:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    environment:
      AWS_ACCESS_KEY_ID: factory_agent
      AWS_SECRET_ACCESS_KEY: factory_agent_dev
      S3_BUCKET: factory-agent-exports,factory-agent-statistics-exports
    ports:
      - "0.0.0.0:8333:8333"
    volumes:
      - ./seaweedfs-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
