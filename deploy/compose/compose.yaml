name: factory-agent

x-assistant-web-build: &assistant-web-build
  # context 必须是仓库根目录：Dockerfile 要分别 COPY frontend/ 与 frontend-h5/
  # 两个子模块。构建加速（国内源）：
  #   docker compose build assistant-web-domain
  #   或：docker build -f deploy/docker/web.Dockerfile \
  #         --build-arg REGISTRY=docker.io \
  #         --build-arg NPM_REGISTRY=https://registry.npmjs.org .
  context: ../..
  dockerfile: deploy/docker/web.Dockerfile

services:
  # ---- 前端站点 profile 1：web-domain ---------------------------------------
  # 自管域名 hz.jundadt.com.cn：Caddy 经 alidns DNS-01 自动签发证书，
  # 对外直接暴露 80/443。需要 .env 提供阿里云 DNS 凭据。
  assistant-web-domain:
    profiles: ["web-domain"]
    build: *assistant-web-build
    image: mes-ai-assistant:latest
    container_name: mes-ai-assistant-domain
    restart: unless-stopped
    ports:
      # 宿主端口可通过 .env 里的 HTTP_PORT / HTTPS_PORT 调整，容器内固定 80/443
      - "${HTTP_PORT:-31080}:80"
      - "${HTTPS_PORT:-31443}:443"
    environment:
      WEB_PROFILE: domain
      # alidns DNS-01 自动签发 hz.jundadt.com.cn 的证书（Caddyfile tls 块引用）。
      # 用阿里云 RAM 子账号，仅授权 AliyunDNSFullAccess；留空时 Caddy 签不了证书。
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      # 智能体后端地址。compose 内部默认走服务名 http://agent-api:8000；
      # 后端不在本 compose 时填外部地址（如 http://117.184.148.14:31000）。
      BACKEND_URL: ${BACKEND_URL:-http://agent-api:8000}

  # ---- 前端站点 profile 2：web-srv-network ----------------------------------
  # 接入既有反向代理：加入外部 docker 网络 srv-domain，由该网络里的
  # caddy / nginx / traefik（任选，本项目不感知）终结 TLS 后转发到本容器 :80。
  # 不发布宿主端口；default 网络保留，用于访问本 compose 的 agent-api。
  assistant-web-srv:
    profiles: ["web-srv-network"]
    build: *assistant-web-build
    image: mes-ai-assistant:latest
    container_name: mes-ai-assistant-srv
    restart: unless-stopped
    networks:
      - default
      - srv-domain
    environment:
      WEB_PROFILE: srv-network
      BACKEND_URL: ${BACKEND_URL:-http://agent-api:8000}

  agent-api:
    # build:
    #   context: ../..
    #   dockerfile: Dockerfile
    image: factory-agent:for-test
    # `.env` is injected wholesale, so tuning a knob (for example
    # FACTORY_AGENT_MES_TIMEOUT_SECONDS) is a one-line edit to that file and
    # needs no change here. Compose also reads the same file for the `${...}`
    # interpolation used below. An explicit entry under `environment:` wins over
    # `env_file:`, which is what keeps `FACTORY_AGENT_ENVIRONMENT`, `_HOST` and
    # `_PORT` container-only: those three are plain literals and are therefore
    # not reachable from `.env`. `required: false` keeps the file additive, so a
    # deployment that exports the variables into the shell still starts.
    env_file:
      - path: .env
        required: false
    environment:
      FACTORY_AGENT_ENVIRONMENT: prod
      FACTORY_AGENT_HOST: 0.0.0.0
      FACTORY_AGENT_PORT: 8000
      FACTORY_AGENT_CANONICAL_MES_BASE_URL: ${FACTORY_AGENT_CANONICAL_MES_BASE_URL:?FACTORY_AGENT_CANONICAL_MES_BASE_URL 未设置：请在 deploy/compose/.env 填写客户真实 MES 网关地址}
      FACTORY_AGENT_POSTGRES_URL: ${FACTORY_AGENT_POSTGRES_URL:-postgresql://factory_agent:factory_agent_dev@postgres:5432/factory_agent}
      FACTORY_AGENT_REDIS_URL: ${FACTORY_AGENT_REDIS_URL:-redis://redis:6379/0}
      # models.yaml resolves the LLM gateway from these (api_key_env etc.);
      # an empty key drops every deployment -> gateway_not_configured.
      FACTORY_AGENT_LLM_API_KEY: ${FACTORY_AGENT_LLM_API_KEY:-}
      FACTORY_AGENT_LLM_API_BASE: ${FACTORY_AGENT_LLM_API_BASE:-}
      FACTORY_AGENT_LLM_MODEL: ${FACTORY_AGENT_LLM_MODEL:-}
      FACTORY_AGENT_LLM_KEY_DEEPSEEK: ${FACTORY_AGENT_LLM_KEY_DEEPSEEK:-}
      FACTORY_AGENT_EXPORT_STORE_DIR: ${FACTORY_AGENT_EXPORT_STORE_DIR:-/app/data/exports}
      FACTORY_AGENT_EXPORT_RETENTION_SECONDS: ${FACTORY_AGENT_EXPORT_RETENTION_SECONDS:-7776000}
      # Export artifacts live in the in-cluster object store (SeaweedFS S3
      # gateway). Leaving FACTORY_AGENT_S3_ENDPOINT_URL empty falls back to the
      # local directory backend, which is what unit tests and host-only runs do.
      FACTORY_AGENT_S3_ENDPOINT_URL: ${FACTORY_AGENT_S3_ENDPOINT_URL:-http://seaweedfs:8333}
      FACTORY_AGENT_S3_BUCKET: ${FACTORY_AGENT_S3_BUCKET:-factory-agent-exports}
      FACTORY_AGENT_S3_ACCESS_KEY: ${FACTORY_AGENT_S3_ACCESS_KEY:-factory_agent}
      FACTORY_AGENT_S3_SECRET_KEY: ${FACTORY_AGENT_S3_SECRET_KEY:-factory_agent_dev}
      # Platform statistics (/v1/statistics). Separate settings prefix and a
      # separate export bucket and directory: the two report backends must never
      # be able to overwrite each other's configuration.
      FACTORY_AGENT_STATISTICS_API_TOKEN: ${FACTORY_AGENT_STATISTICS_API_TOKEN:-}
      FACTORY_AGENT_STATISTICS_TOKEN_SIGNING_SECRET: ${FACTORY_AGENT_STATISTICS_TOKEN_SIGNING_SECRET:-}
      FACTORY_AGENT_STATISTICS_EXPORT_SIGNING_SECRET: ${FACTORY_AGENT_STATISTICS_EXPORT_SIGNING_SECRET:-}
      FACTORY_AGENT_STATISTICS_DOWNLOAD_BASE_URL: ${FACTORY_AGENT_STATISTICS_DOWNLOAD_BASE_URL:-http://127.0.0.1:8000}
      FACTORY_AGENT_STATISTICS_EXPORT_STORE_DIR: ${FACTORY_AGENT_STATISTICS_EXPORT_STORE_DIR:-/app/data/statistics-exports}
      FACTORY_AGENT_STATISTICS_S3_ENDPOINT_URL: ${FACTORY_AGENT_STATISTICS_S3_ENDPOINT_URL:-http://seaweedfs:8333}
      FACTORY_AGENT_STATISTICS_S3_BUCKET: ${FACTORY_AGENT_STATISTICS_S3_BUCKET:-factory-agent-statistics-exports}
      FACTORY_AGENT_STATISTICS_S3_ACCESS_KEY: ${FACTORY_AGENT_STATISTICS_S3_ACCESS_KEY:-factory_agent}
      FACTORY_AGENT_STATISTICS_S3_SECRET_KEY: ${FACTORY_AGENT_STATISTICS_S3_SECRET_KEY:-factory_agent_dev}
      # auto = a factory whose AppKey the customer MES accepted is admitted and
      # registered on first sight; disabled factories are always refused.
      FACTORY_AGENT_STATISTICS_TENANT_REGISTRATION_MODE: ${FACTORY_AGENT_STATISTICS_TENANT_REGISTRATION_MODE:-auto}
    # Auto-migration on start: apply the baseline before serving. Failure aborts
    # startup; the step is idempotent (alembic version table).
    command:
      - sh
      - -c
      - python -m factory_agent.persistence.migrations upgrade head
        && exec uvicorn factory_agent.api.server:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "${FACTORY_AGENT_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Fallback artifact backend only. The default artifact backend is the
      # SeaweedFS object store (see FACTORY_AGENT_S3_* above); these volumes keep
      # the local-directory backends writable when their S3 endpoint is empty,
      # and they are the only writable paths the read-only rootfs allows.
      - agent-exports:/app/data/exports
      - agent-statistics-exports:/app/data/statistics-exports
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-3432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-3379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Object store for export artifacts. The image's default entrypoint is
  # `weed mini -dir=/data` — one process running master, volume, filer and the
  # S3 gateway, self-tuned for a single node (upstream positions it as fit for
  # single-node production). The buckets and the credentials are seeded
  # idempotently from the environment on first start (S3_BUCKET takes a
  # comma-separated list); both AWS_* variables are required, because omitting
  # them degrades to anonymous "Allow All".
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    environment:
      AWS_ACCESS_KEY_ID: ${FACTORY_AGENT_S3_ACCESS_KEY:-factory_agent}
      AWS_SECRET_ACCESS_KEY: ${FACTORY_AGENT_S3_SECRET_KEY:-factory_agent_dev}
      S3_BUCKET: ${FACTORY_AGENT_S3_BUCKET:-factory-agent-exports},${FACTORY_AGENT_STATISTICS_S3_BUCKET:-factory-agent-statistics-exports}
    ports:
      # Loopback only (host-side debugging and integration tests); containers
      # reach it as seaweedfs:8333.
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # Probe the Master status endpoint, not the S3 root: once credentials are
      # seeded the S3 gateway answers 403 to an unsigned request, and `wget`
      # treats any non-2xx as failure — the container would never turn healthy.
      # Master answering 200 means the single `weed mini` process
      # (Master + Volume + Filer + S3 gateway) is serving.
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # No depends_on edge from agent-api: a down object store degrades exports
    # (fail-closed) but must never block the assistant from starting.
    restart: unless-stopped

networks:
  # 既有的反向代理（caddy / nginx / traefik）所在的共享网络；需先在宿主创建：
  #   docker network create srv-domain
  srv-domain:
    external: true

volumes:
  postgres-data:
  redis-data:
  agent-exports:
  agent-statistics-exports:
  seaweedfs-data:
