name: factory-agent

services:
  agent-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: factory-agent:dev
    environment:
      FACTORY_AGENT_ENVIRONMENT: production
      FACTORY_AGENT_HOST: 0.0.0.0
      FACTORY_AGENT_PORT: 8000
      FACTORY_AGENT_CANONICAL_MES_BASE_URL: ${FACTORY_AGENT_CANONICAL_MES_BASE_URL:?FACTORY_AGENT_CANONICAL_MES_BASE_URL 未设置：请在 deploy/compose/.env 填写客户真实 MES 网关地址}
      FACTORY_AGENT_POSTGRES_URL: ${FACTORY_AGENT_POSTGRES_URL:-postgresql://factory_agent:factory_agent_dev@postgres:5432/factory_agent}
      FACTORY_AGENT_REDIS_URL: ${FACTORY_AGENT_REDIS_URL:-redis://redis:6379/0}
      # models.yaml resolves the LLM gateway from these (api_key_env etc.);
      # an empty key drops every deployment -> gateway_not_configured.
      FACTORY_AGENT_LLM_API_KEY: ${FACTORY_AGENT_LLM_API_KEY:-}
      FACTORY_AGENT_LLM_API_BASE: ${FACTORY_AGENT_LLM_API_BASE:-}
      FACTORY_AGENT_LLM_MODEL: ${FACTORY_AGENT_LLM_MODEL:-}
      FACTORY_AGENT_LLM_KEY_DEEPSEEK: ${FACTORY_AGENT_LLM_KEY_DEEPSEEK:-}
      FACTORY_AGENT_EXPORT_STORE_DIR: ${FACTORY_AGENT_EXPORT_STORE_DIR:-/app/data/exports}
      FACTORY_AGENT_EXPORT_RETENTION_SECONDS: ${FACTORY_AGENT_EXPORT_RETENTION_SECONDS:-604800}
    # Auto-migration on start: apply own Alembic baseline before serving.
    # Failure aborts startup; the step is idempotent (alembic version table).
    command:
      - sh
      - -c
      - python -m factory_agent.persistence.migrations upgrade head
        && exec uvicorn factory_agent.api.server:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "${FACTORY_AGENT_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - agent-exports:/app/data/exports
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  usage-admin:
    build:
      context: ../..
      dockerfile: usage-admin/Dockerfile
    image: usage-admin:dev
    environment:
      USAGE_ADMIN_ENVIRONMENT: development
      USAGE_ADMIN_HOST: 0.0.0.0
      USAGE_ADMIN_PORT: 8020
      USAGE_ADMIN_DATABASE_URL: ${USAGE_ADMIN_DATABASE_URL:-postgresql://usage_admin:usage_admin_dev@postgres:5432/factory_agent}
    # Auto-migration on start: usage-admin owns tenant_registry/admin_audit/...
    # in the shared DB, version table alembic_version_usage_admin.
    command:
      - sh
      - -c
      - python -m usage_admin.migrations upgrade head
        && exec uvicorn usage_admin.api.server:create_app --factory --host 0.0.0.0 --port 8020
    ports:
      - "${USAGE_ADMIN_PORT:-8020}:8020"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-3432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-3379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  agent-exports:
