name: factory-agent

services:
  agent-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: factory-agent:dev
    environment:
      FACTORY_AGENT_ENV: development
      FACTORY_AGENT_HOST: 0.0.0.0
      FACTORY_AGENT_PORT: 8000
      FACTORY_AGENT_CANONICAL_MES_BASE_URL: http://mock-mes:8010
      FACTORY_AGENT_POSTGRES_URL: ${FACTORY_AGENT_POSTGRES_URL:-postgresql://factory_agent:factory_agent_dev@postgres:5432/factory_agent}
      FACTORY_AGENT_REDIS_URL: ${FACTORY_AGENT_REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${FACTORY_AGENT_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-mes:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  mock-mes:
    build:
      context: ../..
      dockerfile: mock-mes/Dockerfile
    image: mock-mes:dev
    environment:
      MOCK_MES_HOST: 0.0.0.0
      MOCK_MES_PORT: 8010
      MOCK_MES_DATABASE_URL: ${MOCK_MES_DATABASE_URL:-postgresql://mock_mes:mock_mes_dev@postgres:5432/mock_mes}
      MOCK_MES_SCENARIO: small
      MOCK_MES_SEED: 20260821
      MOCK_MES_VIRTUAL_NOW: "2026-08-21T08:00:00Z"
    ports:
      - "${MOCK_MES_PORT:-8010}:8010"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  usage-admin:
    build:
      context: ../..
      dockerfile: usage-admin/Dockerfile
    image: usage-admin:dev
    environment:
      USAGE_ADMIN_ENVIRONMENT: development
      USAGE_ADMIN_HOST: 0.0.0.0
      USAGE_ADMIN_PORT: 8020
      USAGE_ADMIN_DATABASE_URL: ${USAGE_ADMIN_DATABASE_URL:-postgresql://usage_admin:usage_admin_dev@postgres:5432/usage_admin}
    ports:
      - "${USAGE_ADMIN_PORT:-8020}:8020"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
