<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>挂小组后的部门树与角色范围（假设形态）</title>
  <desc>客户日后在部门下挂小组（小组=子部门节点）后的两层树；组长挂小组只管本小组子树，组长挂部门管整棵部门子树，管理按 manage_dept 绑定取多棵子树并集。</desc>

  <text class="th" x="40" y="30" fill="#444441">复杂形态（假设）：部门下挂「小组」＝子部门节点</text>

  <g>
    <rect x="250" y="44" width="180" height="36" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="ts" x="340" y="62" text-anchor="middle" dominant-baseline="central" fill="#444441">"01" 虚拟根节点</text>
  </g>

  <path d="M340 80 V100 M115 100 H575 M115 100 V120 M365 100 V120 M575 100 V120 M465 100 V120" fill="none" stroke="#888780" stroke-width="0.5"/>

  <rect x="22" y="112" width="226" height="148" rx="10" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 3"/>

  <g>
    <rect x="60" y="120" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="ts" x="115" y="136" text-anchor="middle" dominant-baseline="central" fill="#0C447C">001</text>
    <text class="ts" x="115" y="152" text-anchor="middle" dominant-baseline="central" fill="#0C447C">缝制</text>
  </g>
  <g>
    <rect x="310" y="120" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="ts" x="365" y="136" text-anchor="middle" dominant-baseline="central" fill="#0C447C">005</text>
    <text class="ts" x="365" y="152" text-anchor="middle" dominant-baseline="central" fill="#0C447C">后道（叶）</text>
  </g>
  <g>
    <rect x="425" y="120" width="80" height="44" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
    <text class="ts" x="465" y="142" text-anchor="middle" dominant-baseline="central" fill="#888780">…其余</text>
  </g>
  <g>
    <rect x="520" y="120" width="110" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="ts" x="575" y="136" text-anchor="middle" dominant-baseline="central" fill="#0C447C">006</text>
    <text class="ts" x="575" y="152" text-anchor="middle" dominant-baseline="central" fill="#0C447C">裁剪</text>
  </g>
  <rect x="514" y="114" width="122" height="56" rx="10" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 3"/>

  <path d="M115 164 V186 M80 186 H190 M80 186 V208 M190 186 V208" fill="none" stroke="#888780" stroke-width="0.5"/>

  <rect x="26" y="204" width="108" height="52" rx="8" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 3"/>
  <g>
    <rect x="30" y="208" width="100" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="ts" x="80" y="224" text-anchor="middle" dominant-baseline="central" fill="#0C447C">001-01</text>
    <text class="ts" x="80" y="240" text-anchor="middle" dominant-baseline="central" fill="#0C447C">平车组</text>
  </g>
  <g>
    <rect x="140" y="208" width="100" height="44" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
    <text class="ts" x="190" y="224" text-anchor="middle" dominant-baseline="central" fill="#0C447C">001-02</text>
    <text class="ts" x="190" y="240" text-anchor="middle" dominant-baseline="central" fill="#0C447C">手工组</text>
  </g>

  <text class="ts" x="40" y="282" fill="#444441">青虚线＝组长挂小组（张三：001-01）　蓝虚线＝组长挂部门（王五：001 整棵子树）　琥珀虚线＝管理绑定（李四：001+006）</text>

  <g>
    <rect x="40" y="300" width="196" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="54" y="318" fill="#085041">组长·挂小组（张三）</text>
    <text class="ts" x="54" y="336" fill="#085041">dept = "001-01"</text>
    <text class="ts" x="54" y="353" fill="#0F6E56">范围＝平车组子树，兄弟组不可见</text>
  </g>
  <g>
    <rect x="242" y="300" width="196" height="72" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="256" y="318" fill="#0C447C">组长·挂部门（王五）</text>
    <text class="ts" x="256" y="336" fill="#0C447C">dept = "001"</text>
    <text class="ts" x="256" y="353" fill="#185FA5">范围＝001 + 001-01/001-02</text>
  </g>
  <g>
    <rect x="444" y="300" width="196" height="72" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="458" y="318" fill="#633806">管理（李四）</text>
    <text class="ts" x="458" y="336" fill="#633806">manage_dept = "001,006"</text>
    <text class="ts" x="458" y="353" fill="#854F0B">范围＝两棵子树并集，可绑小组</text>
  </g>

  <text class="ts" x="40" y="398" fill="#5F5E5A">小组就是 dept（树节点），层级可任意深，所有角色范围一律按 pid 递归子树计算；</text>
  <text class="ts" x="40" y="414" fill="#5F5E5A">管理可绑部门或小组任意节点、多个绑定取并集，与本人所在 dept 无关（临时工/测试等虚拟节点略）</text>
</svg>
