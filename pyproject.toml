[project]
name = "factory-agent"
version = "0.1.0"
description = "Read-only factory MES assistant powered by validated API orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0,<2.0.0",
    "check-jsonschema>=0.33.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pip-audit>=2.9.0,<3.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "pyright>=1.1.400,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
factory-agent = "factory_agent.__main__:main"

[tool.uv.workspace]
members = ["mock-mes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_agent"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
testpaths = ["tests", "mock-mes/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pyright]
include = ["src", "tests", "mock-mes/src", "mock-mes/tests"]
extraPaths = ["src", "mock-mes/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
