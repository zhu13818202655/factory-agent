name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MOCK_MES_TEST_DATABASE_URL: postgresql://postgres:postgres_dev@127.0.0.1:5432/mock_mes_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.15"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install workspace
        run: uv sync --frozen --all-packages --group dev
      - name: Create mock-mes test database
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres_dev postgres:16-alpine \
            createdb -h 127.0.0.1 -U postgres mock_mes_test
      - name: Run blocking gates
        run: make check
      - name: Validate Compose
        run: make compose-config

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: make build-images
      - name: Verify application images
        run: make test-images
